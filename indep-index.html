<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EchoSearch</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #fafafa;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 80px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 30px;
      color: #b8860b;
      font-weight: 700;
    }

    #searchBox {
      width: 600px;
      max-width: 90%;
      padding: 14px 20px;
      font-size: 18px;
      border: 2px solid #ddd;
      border-radius: 30px;
      outline: none;
      transition: 0.25s;
    }

    #searchBox:focus {
      border-color: #b8860b;
      box-shadow: 0 0 8px rgba(184, 134, 11, 0.4);
    }

    #results {
      margin-top: 40px;
      width: 600px;
      max-width: 90%;
    }

    .result {
      background: white;
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 12px;
      border: 1px solid #eee;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #333;
    }

    .url {
      font-size: 14px;
      color: #0066cc;
      margin-bottom: 8px;
      word-break: break-all;
    }

    .snippet {
      font-size: 15px;
      color: #444;
    }
  </style>
</head>

<body>
  <h1>EchoSearch</h1>

  <input 
    id="searchBox" 
    type="text" 
    placeholder="Search the web..." 
    onkeydown="if(event.key === 'Enter') search()"
  />

  <div id="results"></div>

  <script>
    async function search() {
      const query = document.getElementById("searchBox").value.trim();
      const container = document.getElementById("results");

      container.innerHTML = "Searching...";

      try {
        const url = "https://echo-search-index.onrender.com/search?q=" + encodeURIComponent(query);

        const response = await fetch(url);
        const data = await response.json();

        container.innerHTML = "";

        if (!data.results || data.results.length === 0) {
          container.innerHTML = "<p>No results found.</p>";
          return;
        }

        data.results.forEach(item => {
          const div = document.createElement("div");
          div.className = "result";

          div.innerHTML = `
            <div class="title">${item.title || "Untitled"}</div>
            <div class="url">${item.url}</div>
            <div class="snippet">${item.description || ""}</div>
          `;

          container.appendChild(div);
        });

      } catch (err) {
        container.innerHTML = "Error connecting to server.";
      }
    }
  </script>
</body>
</html>
