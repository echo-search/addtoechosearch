<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EchoSearch – Answer-First</title>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  max-width: 900px;
  margin: auto;
  padding: 20px;
  background: #fafafa;
  color: #111;
}
#answer { margin-bottom: 20px; }
.answer-card {
  border-left: 4px solid #4caf50;
  background: #f6fff6;
  padding: 14px;
  margin-bottom: 20px;
}
.answer-card h3 { font-size:12px; color:#2e7d32; text-transform:uppercase; margin:0 0 6px; }
.answer-card p { font-size:16px; margin:0 0 8px; }
.answer-card a { font-size:14px; color:#1a73e8; text-decoration:none; }
.gcse-search { margin-top:10px; }
</style>

<!-- Google CSE -->
<script async src="https://cse.google.com/cse.js?cx=8504b5117a0734987"></script>
</head>
<body>

<h1>EchoSearch – Answer-First</h1>

<!-- Answer container -->
<div id="answer"></div>

<!-- Google CSE search box + results -->
<div class="gcse-search"></div>

<iframe src="https://echo-artificial-intelligence.netlify.app"></iframe>

<script>
/* ============================
   Fetch answers from Flask backend
============================ */
async function fetchAnswer(query) {
  const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
  const data = await res.json();
  return data;
}

/* ============================
   Hook into CSE search
============================ */
window.__gcse = {
  callback: function() {
    const input = document.querySelector("input.gsc-input");
    if (!input) return;

    input.addEventListener("keydown", async e => {
      if (e.key !== "Enter") return;
      const query = input.value;
      const container = document.getElementById("answer");
      container.innerHTML = "";

      try {
        const data = await fetchAnswer(query);
        if (data.found) {
          container.innerHTML = `
            <div class="answer-card">
              <h3>Answer</h3>
              <p>${data.text}</p>
              <a href="${data.url}#:~:text=${encodeURIComponent(data.text)}" target="_blank" rel="noopener">Source</a>
            </div>
          `;
        }
      } catch(err) {
        console.error("Error fetching answer:", err);
      }
    });
  }
};
</script>

</body>
</html>
