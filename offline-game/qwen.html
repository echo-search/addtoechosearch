<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cache Cleaner Simulator</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
html, body { width:100%; height:100%; overflow:hidden; background:#111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color:#fff; }
#gameCanvas { display:block; width:100%; height:100%; touch-action:none; }
.overlay { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.85); z-index:10; transition: opacity 0.3s; }
.hidden { opacity:0; pointer-events:none; }
.panel { background:#222; border:2px solid #444; border-radius:12px; padding:20px; max-width:500px; width:90%; box-shadow:0 0 20px rgba(0,0,0,0.5); text-align:center; }
h1 { margin-bottom:10px; color:#0ff; text-shadow:0 0 8px #0ff; }
h2 { color:#0f0; margin:10px 0; }
.btn { background:#333; color:#fff; border:1px solid #555; padding:8px 16px; margin:5px; border-radius:6px; cursor:pointer; transition:0.2s; font-size:14px; }
.btn:hover { background:#444; border-color:#888; transform:scale(1.05); }
.btn.active { background:#0a5; border-color:#0f0; box-shadow:0 0 8px #0f0; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
.row { display:flex; flex-wrap:wrap; justify-content:center; gap:5px; margin:5px 0; }
.bar-container { width:100%; height:12px; background:#333; border-radius:6px; overflow:hidden; margin:5px 0; position:relative; }
.bar-fill { height:100%; background:linear-gradient(90deg, #0ff, #f0f); transition: width 0.2s; }
#hud { position:absolute; top:0; left:0; width:100%; padding:8px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; z-index:5; }
.hud-item { background:rgba(0,0,0,0.6); padding:4px 10px; border-radius:6px; font-size:14px; text-shadow:0 0 4px #000; }
#pauseBtn, #soundBtn { pointer-events:auto; cursor:pointer; }
.warning-flash { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(255,0,0,0.3); pointer-events:none; opacity:0; transition: opacity 0.2s; z-index:4; }
.stat-row { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #333; }
.mode-select { display:flex; flex-wrap:wrap; justify-content:center; gap:5px; margin:10px 0; }
.powerups { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:5; pointer-events:auto; }
.pbtn { width:40px; height:40px; border-radius:8px; border:2px solid #555; background:#222; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px; position:relative; }
.pbtn.active { border-color:#ff0; background:#332; box-shadow:0 0 10px #ff0; }
.pbtn .cd { position:absolute; bottom:-2px; right:-2px; font-size:10px; background:#000; padding:1px 4px; border-radius:4px; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div class="warning-flash" id="warningFlash"></div>
<div id="hud" class="hidden">
  <div class="hud-item" id="scoreDisplay">Score: 0</div>
  <div class="hud-item" id="comboDisplay">Combo: x1</div>
  <div class="hud-item" id="timerDisplay">Time: 00:00</div>
  <div class="hud-item" id="livesDisplay">❤️ 3</div>
  <button class="btn" id="pauseBtn">⏸</button>
</div>
<div class="powerups hidden" id="powerupBar">
  <div class="pbtn" data-p="clear" title="Clear All">💥</div>
  <div class="pbtn" data-p="slow" title="Slow Motion">🐢</div>
  <div class="pbtn" data-p="freeze" title="Freeze">❄️</div>
  <div class="pbtn" data-p="magnet" title="Magnet">🧲</div>
  <div class="pbtn" data-p="shield" title="Shield">🛡️</div>
  <div class="pbtn" id="soundBtn" title="Sound">🔊</div>
</div>
<div id="mainMenu" class="overlay">
  <div class="panel">
    <h1>🗑️ Cache Cleaner Simulator</h1>
    <div class="row">
      <span>Mode:</span>
    </div>
    <div class="mode-select" id="modeSelect">
      <button class="btn active" data-mode="survival">Survival</button>
      <button class="btn" data-mode="timeattack">Time Attack</button>
      <button class="btn" data-mode="precision">Precision</button>
      <button class="btn" data-mode="chaos">Chaos</button>
      <button class="btn" data-mode="hardcore">Hardcore (1 Life)</button>
      <button class="btn" data-mode="minichallenge">Mini-Challenge</button>
      <button class="btn" data-mode="bossrush">Boss Rush</button>
      <button class="btn" data-mode="mirror">Mirror Mode</button>
      <button class="btn" data-mode="gravityflip">Gravity Flip</button>
      <button class="btn" data-mode="safemode">Safe Mode</button>
    </div>
    <div class="row">
      <span>Difficulty:</span>
    </div>
    <div class="row" id="diffSelect">
      <button class="btn" data-diff="easy">Easy</button>
      <button class="btn active" data-diff="normal">Normal</button>
      <button class="btn" data-diff="hard">Hard</button>
    </div>
    <div style="margin-top:10px;">High Score: <span id="highScoreMenu">0</span></div>
    <button class="btn" id="startBtn" style="margin-top:15px; background:#0a5; padding:10px 30px; font-size:18px;">START</button>
  </div>
</div>
<div id="pauseScreen" class="overlay hidden">
  <div class="panel">
    <h2>PAUSED</h2>
    <div class="row">
      <button class="btn" id="resumeBtn">Resume</button>
      <button class="btn" id="quitBtn">Quit</button>
    </div>
  </div>
</div>
<div id="gameOver" class="overlay hidden">
  <div class="panel">
    <h2 id="endTitle">GAME OVER</h2>
    <div id="statsPanel"></div>
    <div class="bar-container" style="margin:15px 0 5px;"><div class="bar-fill" id="spawnBar" style="width:0%; background:#f44;"></div></div>
    <button class="btn" id="restartBtn" style="margin-top:10px;">PLAY AGAIN</button>
  </div>
</div>
<script>
"use strict";
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = () => canvas.width;
const H = () => canvas.height;
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

// --- Audio Engine (Web Audio API) ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audio = null;
function initAudio() { if(!audio) audio = new AudioCtx(); }
let soundEnabled = true;
function playTone(freq, type, dur, vol=0.1) {
  if(!soundEnabled || !audio) return;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audio.currentTime);
  gain.gain.setValueAtTime(vol, audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
  osc.connect(gain); gain.connect(audio.destination);
  osc.start(); osc.stop(audio.currentTime + dur);
}
function sndClick() { playTone(400 + Math.random()*200, 'square', 0.08); }
function sndPower() { playTone(600, 'sine', 0.2, 0.15); }
function sndExplosion() { playTone(150, 'sawtooth', 0.3, 0.1); }
function sndLoss() { playTone(100, 'triangle', 0.4, 0.15); }
function sndWave() { playTone(800, 'sine', 0.1); playTone(1200, 'sine', 0.15); }

// --- Game State & Config ---
const STATE = { MENU:0, PLAYING:1, PAUSED:2, END:3 };
let gameState = STATE.MENU;
let mode = 'survival';
let diff = 'normal';
let score = 0, lives = 3, combo = 0, maxCombo = 0, multiplier = 1;
let junk = [], particles = [], popups = [], powerUpsSpawned = [];
let lastTime = 0, gameTime = 0, spawnTimer = 0, spawnInterval = 1500;
let shake = { x:0, y:0, time:0, intensity:0 };
let globalSpeed = 1, slowTime = 0, freezeTime = 0, magnetTime = 0, shieldActive = false;
let lastClickTime = 0, longPressTime = 0, isLongPressing = false;
let waveIncomingTimer = 0, stormCount = 0;
let challengeTarget = 20, challengeCleared = 0, challengeTimer = 10;
let highScore = parseInt(localStorage.getItem('cc_highscore') || '0');
let mouseX = 0, mouseY = 0, isMouseDown = false;
let stats = { clicks:0, junkCleared:0, time:0, bossKills:0, merges:0, splits:0 };

// UI Elements
const els = {
  menu: document.getElementById('mainMenu'), pause: document.getElementById('pauseScreen'), end: document.getElementById('gameOver'),
  hud: document.getElementById('hud'), warn: document.getElementById('warningFlash'),
  score: document.getElementById('scoreDisplay'), combo: document.getElementById('comboDisplay'),
  timer: document.getElementById('timerDisplay'), lives: document.getElementById('livesDisplay'),
  hsMenu: document.getElementById('highScoreMenu'), stats: document.getElementById('statsPanel'),
  spawnBar: document.getElementById('spawnBar'), endTitle: document.getElementById('endTitle'),
  modeBtns: document.querySelectorAll('#modeSelect .btn'), diffBtns: document.querySelectorAll('#diffSelect .btn'),
  pbtns: document.querySelectorAll('.pbtn[data-p]'), soundBtn: document.getElementById('soundBtn')
};
els.hsMenu.textContent = highScore;

// --- Classes ---
class Particle {
  constructor(x, y, color, size, vx, vy, life) {
    this.x=x; this.y=y; this.color=color; this.size=size; this.vx=vx; this.vy=vy; this.life=life; this.maxLife=life; this.gravity = 0.15;
  }
  update(dt) {
    this.life -= dt; this.vy += this.gravity * dt * 60;
    this.x += this.vx * dt * 60; this.y += this.vy * dt * 60;
  }
  draw(ctx) {
    ctx.globalAlpha = Math.max(0, this.life/this.maxLife);
    ctx.fillStyle = this.color; ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha=1;
  }
}

class Popup {
  constructor(x,y,text,color='#fff',size=16) {
    this.x=x; this.y=y; this.text=text; this.color=color; this.size=size; this.life=1.0; this.vy=-50;
  }
  update(dt) { this.life-=dt; this.y+=this.vy*dt; this.vy*=0.95; }
  draw(ctx) {
    ctx.globalAlpha=Math.max(0, this.life); ctx.fillStyle=this.color;
    ctx.font=`bold ${this.size}px sans-serif`; ctx.textAlign='center'; ctx.fillText(this.text, this.x, this.y);
    ctx.globalAlpha=1;
  }
}

class PowerUp {
  constructor(x,y,type) {
    this.x=x; this.y=y; this.type=type; this.r=18; this.life=8; this.baseY=y; this.wave=Math.random()*100;
  }
  update(dt) {
    this.life-=dt; this.wave+=dt*3; this.y = this.baseY + Math.sin(this.wave)*5;
    if(gameState!==STATE.PLAYING) return;
    if(mode==='gravityflip') this.y += -0.5*dt*60*globalSpeed;
    else this.y += 0.5*dt*60*globalSpeed;
  }
  draw(ctx) {
    ctx.globalAlpha=1; ctx.fillStyle=this.type==='clear'?'#f00':this.type==='slow'?'#0ff':this.type==='freeze'?'#0af':this.type==='magnet'?'#f0f':'#ff0';
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(this.type[0].toUpperCase(), this.x, this.y);
  }
}

class Junk {
  constructor(x,y,overrides={}) {
    this.x=x; this.y=y; this.vx=(Math.random()-0.5)*100; this.vy=(Math.random()*50+80) * (mode==='gravityflip'?-1:1);
    this.baseVy = this.vy;
    this.size = 20 + Math.random()*30; this.baseSize = this.size;
    this.color = `hsl(${Math.random()*360},70%,50%)`; this.hp=1; this.maxHp=1;
    this.rotation=0; this.rotSpeed=(Math.random()-0.5)*2; this.opacity=1;
    this.behaviors = []; this.merged=false; this.alive=true; this.type='normal';
    this.spawnTime=0; this.blinkTimer=0; this.invisible=false; this.fadeDir=1; this.splitCooldown=0;
    this.bounceCount=0; this.zigTimer=0; this.shrink=0; this.speedMult=1;
    this.isBoss=false; this.isGolden=false; this.isRed=false; this.isMerging=false;
    this.shape = Math.random()<0.5?0:1; // 0: rect, 1: circle
    
    if(diff==='easy'){this.vy*=0.7; this.size*=1.2;}
    else if(diff==='hard'){this.vy*=1.4; this.size*=0.8;}
    if(mode==='precision'){this.vy*=0.5; this.size*=0.6;}

    Object.assign(this, overrides);
    this.spawnTime=gameTime; this.updateShapeAndSize();
  }
  updateShapeAndSize() {
    // Feature 10 & 20: shrinks / changes size
    this.size = this.baseSize * Math.max(0.3, 1 - this.shrink);
    if(this.shrink>0) this.shrink += 0.0005 * globalSpeed;
    this.size += Math.sin(this.spawnTime*2 + this.x)*2;
  }
  applyBehaviors(dt) {
    this.spawnTime += dt; this.splitCooldown -= dt;
    this.rotation += this.rotSpeed * dt * 60 * globalSpeed;
    this.blinkTimer += dt*globalSpeed;

    // Feature 14: invisible temporarily
    if(this.behaviors.includes('blink')) this.invisible = (Math.floor(this.blinkTimer)%2===0);
    // Feature 15: fade in/out
    if(this.behaviors.includes('fade')) { this.opacity += this.fadeDir*dt; if(this.opacity>1||this.opacity<0.2) this.fadeDir*=-1; }
    else this.opacity=1;

    if(this.invisible) this.opacity=0.1;

    // Feature 4: sideways
    if(this.behaviors.includes('sideways')) this.vx += (Math.random()-0.5)*200*dt*globalSpeed;
    // Feature 5: teleport
    if(this.behaviors.includes('teleport') && Math.random()<0.002*dt*globalSpeed) {
      this.x = Math.random()*W(); this.y = Math.random()*H()*0.5; sndPower();
    }
    // Feature 9: rotating handled
    // Feature 11: speed up
    if(gameTime - this.spawnTime > 10) this.speedMult = 1 + Math.floor((gameTime-this.spawnTime)/10)*0.1;
    // Feature 12: bounce
    if(this.behaviors.includes('bounce')) {
      if(this.x<this.size||this.x>W()-this.size) { this.vx*=-1; this.bounceCount++; }
      if((this.y<this.size && mode!=='gravityflip')||(this.y>H()-this.size && mode==='gravityflip')) this.vy*=-1;
    }
    // Feature 13: zigzag
    if(this.behaviors.includes('zigzag')) { this.vx = Math.sin(this.spawnTime*5)*150*globalSpeed; }
    // Feature 18: wave pattern
    if(this.behaviors.includes('wave')) this.x += Math.sin(this.spawnTime*3)*100*dt*globalSpeed;

    // Feature 26: Magnet
    if(magnetTime>0) {
      let dx = mouseX - this.x, dy = mouseY - this.y;
      let dist = Math.sqrt(dx*dx+dy*dy)+1;
      this.vx += (dx/dist)*300*dt*globalSpeed;
      this.vy += (dy/dist)*300*dt*globalSpeed;
    }

    this.vx *= 0.98; this.vy *= 0.98;
    this.x += this.vx * dt * 60 * globalSpeed * this.speedMult;
    this.y += this.vy * dt * 60 * globalSpeed * this.speedMult;

    // Bounds check
    let yOut = (mode==='gravityflip' && this.y < -this.size) || (!mode==='gravityflip' && this.y > H()+this.size);
    if(this.x<-50 || this.x>W()+50 || yOut) {
      if(!this.isBoss && mode!=='safemode') {
        lives--; sndLoss(); shakeScreen(5);
        if(mode==='hardcore') lives=0;
        if(lives<=0) endGame('LOST');
      }
      this.alive=false; combo=0;
    }
    this.updateShapeAndSize();
  }
  hit(mx, my) {
    let dist = Math.sqrt((mx-this.x)**2 + (my-this.y)**2);
    let hitRadius = mode==='precision' ? this.size*0.4 : this.size*0.8;
    if(dist < hitRadius) {
      if(this.isBoss) { this.hp--; sndClick(); spawnPop(this.x,this.y-20,`-${this.hp} HP`, '#f88'); }
      else {
        sndClick(); this.hp=0;
        // Feature 21,22,23: combo & multiplier
        combo++; maxCombo=Math.max(maxCombo, combo); multiplier = 1 + Math.floor(combo/10)*0.5;
        if(combo%100===0) { score+=500; spawnPop(this.x,this.y,'STREAK!', '#ff0', 20); sndPower(); }
        let pts = this.isGolden?5 : (this.isRed?-5 : 1);
        score += pts * Math.max(1, multiplier);
        if(pts>0) spawnPop(this.x,this.y-10, `+${pts}`, '#0f0');
        else spawnPop(this.x,this.y-10, `-5`, '#f00');
        stats.junkCleared++; stats.clicks++;
        if(this.isBoss) stats.bossKills++;

        // Feature 3: split
        if(this.behaviors.includes('split') && this.size>15 && this.splitCooldown<=0) {
          spawnJunk(this.x, this.y, {size:this.size*0.6, baseSize:this.size*0.6, vx:(Math.random()-0.5)*150, vy:this.vy*0.8, behaviors:['split'], splitCooldown:0.5});
          spawnJunk(this.x, this.y, {size:this.size*0.6, baseSize:this.size*0.6, vx:(Math.random()-0.5)*150, vy:this.vy*0.8, behaviors:['split'], splitCooldown:0.5});
          stats.splits+=2; sndPower();
        }

        // Feature 17: explode
        spawnExplosion(this.x, this.y, this.color, this.isBoss?25:10);
        sndExplosion();
      }
      this.alive=false; return true;
    }
    return false;
  }
  draw(ctx) {
    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation); ctx.globalAlpha=this.opacity;
    ctx.fillStyle = this.isBoss?'#f0f':this.isGolden?'#ff0':this.isRed?'#f00':this.color;
    if(this.shape===0) ctx.fillRect(-this.size/2,-this.size/2,this.size,this.size);
    else { ctx.beginPath(); ctx.arc(0,0,this.size/2,0,Math.PI*2); ctx.fill(); }
    if(this.isBoss) { ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(-this.size/2-2,-this.size/2-2,this.size+4,this.size+4); }
    ctx.globalAlpha=1; ctx.restore();
  }
}

// --- Helpers ---
function spawnJunk(x,y,ov={}) { junk.push(new Junk(x,y,ov)); }
function spawnPop(x,y,text,color='#fff',size=16) { popups.push(new Popup(x,y,text,color,size)); }
function spawnExplosion(x,y,color,count=10) {
  for(let i=0;i<count;i++) {
    let a=Math.random()*Math.PI*2, s=Math.random()*150+50;
    particles.push(new Particle(x,y,color,Math.random()*3+1,Math.cos(a)*s,Math.sin(a)*s,0.5+Math.random()*0.5));
  }
}
function shakeScreen(int) { shake.time=0.3; shake.intensity=int; }
function applyFlash() { document.body.style.boxShadow='inset 0 0 50px #0ff'; setTimeout(()=>document.body.style.boxShadow='',100); }
function triggerSlow(t=5) { slowTime=t; globalSpeed=0.4; sndPower(); applyFlash(); }
function triggerFreeze(t=4) { freezeTime=t; sndPower(); applyFlash(); }
function triggerMagnet(t=6) { magnetTime=t; sndPower(); applyFlash(); }
function triggerClearAll() {
  junk.forEach(j=>{ spawnExplosion(j.x,j.y,j.color,8); j.alive=false; });
  sndPower(); applyFlash();
}
function triggerShield(t=8) { shieldActive=true; sndPower(); applyFlash(); }

function activatePower(type) {
  if(type==='clear') triggerClearAll();
  else if(type==='slow') triggerSlow();
  else if(type==='freeze') triggerFreeze();
  else if(type==='magnet') triggerMagnet();
  else if(type==='shield') triggerShield();
  sndPower();
}

// --- Input ---
function getPos(e) {
  let t = e.touches ? e.touches[0] : e;
  return {x: mode==='mirror' ? W()-t.clientX : t.clientX, y: t.clientY};
}
canvas.addEventListener('mousemove', e => { mouseX=mode==='mirror'?W()-e.clientX:e.clientX; mouseY=e.clientY; });
canvas.addEventListener('touchmove', e => { e.preventDefault(); let p=getPos(e); mouseX=p.x; mouseY=p.y; }, {passive:false});
function handleClick(e) {
  if(gameState!==STATE.PLAYING) return;
  let t = e.touches ? e.touches[0] : e; let mx=mode==='mirror'?W()-t.clientX:t.clientX; let my=t.clientY;
  let now = performance.now();
  let clicked=false;

  // Feature 27: double tap
  let isDouble = (now-lastClickTime)<300;
  if(isDouble && mode!=='precision') { spawnPop(mx,my-30,'2X!', '#ff0', 14); multiplier*=2; sndPower(); }
  lastClickTime = now; isLongPressing = false; longPressTime = now;

  for(let i=junk.length-1;i>=0;i--) {
    if(junk[i].hit(mx,my)) { clicked=true; break; }
  }
  // Check powerup pickups
  for(let i=powerUpsSpawned.length-1;i>=0;i--) {
    let p=powerUpsSpawned[i]; let d=Math.sqrt((mx-p.x)**2+(my-p.y)**2);
    if(d<p.r) { activatePower(p.type); powerUpsSpawned.splice(i,1); }
  }
  if(!clicked && !isLongPressing) { combo=0; multiplier=1; }
}
canvas.addEventListener('mousedown', handleClick);
canvas.addEventListener('touchstart', e=>{ e.preventDefault(); handleClick(e); }, {passive:false});
canvas.addEventListener('mouseup', ()=>{ isMouseDown=false; longPressTime=0; });
canvas.addEventListener('touchend', ()=>{ isMouseDown=false; longPressTime=0; });

// Feature 28: Long press
canvas.addEventListener('mousedown', ()=>{ isMouseDown=true; longPressTime=performance.now(); });
canvas.addEventListener('touchstart', e=>{ isMouseDown=true; longPressTime=performance.now(); }, {passive:true});

// Buttons
document.getElementById('startBtn').onclick = startGame;
document.getElementById('resumeBtn').onclick = resumeGame;
document.getElementById('quitBtn').onclick = () => { gameState=STATE.MENU; els.pause.classList.add('hidden'); els.menu.classList.remove('hidden'); };
document.getElementById('restartBtn').onclick = () => { gameState=STATE.MENU; els.end.classList.add('hidden'); els.menu.classList.remove('hidden'); };
document.getElementById('pauseBtn').onclick = pauseGame;

els.soundBtn.onclick = () => { soundEnabled=!soundEnabled; els.soundBtn.textContent=soundEnabled?'🔊':'🔇'; };
els.pbtns.forEach(b=>b.onclick=()=>activatePower(b.dataset.p));

els.modeBtns.forEach(b=>b.onclick=()=>{ mode=b.dataset.mode; els.modeBtns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); });
els.diffBtns.forEach(b=>b.onclick=()=>{ diff=b.dataset.diff; els.diffBtns.forEach(x=>x.classList.remove('active')); b.classList.add('active'); });

function startGame() {
  initAudio(); gameState=STATE.PLAYING;
  score=0; combo=0; multiplier=1; maxCombo=0; lives = mode==='hardcore'?1:3;
  gameTime=0; spawnTimer=0; junk=[]; particles=[]; popups=[]; powerUpsSpawned=[];
  globalSpeed=1; slowTime=0; freezeTime=0; magnetTime=0; shieldActive=false;
  challengeCleared=0; challengeTimer=10;
  stats = {clicks:0, junkCleared:0, time:0, bossKills:0, merges:0, splits:0};
  els.menu.classList.add('hidden'); els.hud.classList.remove('hidden'); els.powerupBar.classList.remove('hidden');
  els.lives.textContent = '❤️'.repeat(lives);
  els.spawnBar.style.width='0%';
  sndWave();
}
function pauseGame() { if(gameState===STATE.PLAYING){ gameState=STATE.PAUSED; els.pause.classList.remove('hidden'); } }
function resumeGame() { gameState=STATE.PLAYING; els.pause.classList.add('hidden'); }
function endGame(reason) {
  gameState=STATE.END;
  els.endTitle.textContent = reason==='LOST'?'SYSTEM CRASH':'CACHE CLEARED';
  if(score>highScore){highScore=score; localStorage.setItem('cc_highscore', highScore);}
  els.stats.innerHTML = `
    <div class="stat-row"><span>Final Score</span><b>${Math.floor(score)}</b></div>
    <div class="stat-row"><span>High Score</span><b>${highScore}</b></div>
    <div class="stat-row"><span>Junk Cleared</span><b>${stats.junkCleared}</b></div>
    <div class="stat-row"><span>Max Combo</span><b>x${maxCombo}</b></div>
    <div class="stat-row"><span>Boss Kills</span><b>${stats.bossKills}</b></div>
    <div class="stat-row"><span>Splits/Merges</span><b>${stats.splits}/${stats.merges}</b></div>
    <div class="stat-row"><span>Time</span><b>${stats.time.toFixed(1)}s</b></div>
  `;
  setTimeout(()=>{ els.end.classList.remove('hidden'); els.powerupBar.classList.add('hidden'); }, 500);
}

// --- Main Loop ---
let waveAnnounceTimer=0;
function loop(timestamp) {
  let dt = Math.min((timestamp - lastTime)/1000, 0.05);
  lastTime = timestamp;

  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W(),H());

  // Screen shake
  if(shake.time>0) { shake.time-=dt; shake.x=(Math.random()-0.5)*shake.intensity; shake.y=(Math.random()-0.5)*shake.intensity; }
  else shake.x=0;
  ctx.translate(shake.x, shake.y);

  if(gameState===STATE.PLAYING) {
    gameTime+=dt; stats.time=gameTime;
    let effDt = dt * (freezeTime>0?0:1) * globalSpeed;
    if(freezeTime>0) freezeTime-=dt;
    if(slowTime>0) { slowTime-=dt; if(slowTime<=0) globalSpeed=1; }
    if(magnetTime>0) magnetTime-=dt;

    // Feature 28: Long press beam
    if(isMouseDown && longPressTime>0 && performance.now()-longPressTime>600) {
      ctx.strokeStyle = 'rgba(0,255,255,0.4)'; ctx.lineWidth = 8; ctx.beginPath();
      ctx.moveTo(mouseX, 0); ctx.lineTo(mouseX, H()); ctx.stroke();
      ctx.strokeStyle='#0ff'; ctx.lineWidth=3; ctx.stroke();
      junk.forEach(j=>{
        if(Math.abs(j.x-mouseX)<j.size) { j.hp--; if(j.hp<=0) j.alive=false; }
      });
    }

    // Spawning
    spawnInterval = Math.max(200, 1200 - gameTime*5);
    if(mode==='timeattack' && gameTime>30) endGame('TIME UP');
    if(mode==='minichallenge') { challengeTimer-=dt; if(challengeTimer<=0) endGame(challengeCleared>=20?'CHALLENGE WON':'FAILED'); }
    if(mode==='bossrush' && junk.filter(j=>j.isBoss).length<3 && Math.random()<0.01*globalSpeed) spawnJunk(Math.random()*W(), -50, {isBoss:true, hp:5, size:60, baseSize:60});
    else if(Math.random()< (1-spawnInterval/2000)*dt*10 && gameState===STATE.PLAYING) {
      spawnJunk(Math.random()*W(), -50);
      // Feature 19: Storm
      if(Math.random()<0.002) { stormCount=20; sndWave(); waveIncomingTimer=2; spawnPop(W()/2, H()/2-100, '⚡ STORM ⚡', '#f0f', 24); }
      if(stormCount>0) { for(let i=0;i<3;i++) spawnJunk(Math.random()*W(), -30-i*40); stormCount--; }
    }
    if(waveIncomingTimer>0) { waveIncomingTimer-=dt; els.warn.style.opacity = Math.sin(waveIncomingTimer*10)*0.5+0.2; } else els.warn.style.opacity=0;

    // Feature 35: Wave incoming
    if(Math.floor(gameTime)%15===0 && waveAnnounceTimer<gameTime-1) { waveAnnounceTimer=gameTime; sndWave(); spawnPop(W()/2,100,'WAVE INCOMING','#ff0',18); }

    // Update entities
    powerUpsSpawned.forEach(p=>p.update(dt));
    powerUpsSpawned = powerUpsSpawned.filter(p=>p.life>0 && p.y>-50 && p.y<H()+50);
    
    // Feature 16: Merge
    for(let i=0;i<junk.length;i++){
      for(let j=i+1;j<junk.length;j++){
        if(junk[i].alive && junk[j].alive && !junk[i].isBoss && !junk[j].isBoss){
          let d = Math.sqrt((junk[i].x-junk[j].x)**2 + (junk[i].y-junk[j].y)**2);
          if(d < (junk[i].size+junk[j].size)/2){
            junk[i].size += junk[j].size*0.3; junk[i].hp = Math.max(junk[i].hp, junk[j].hp);
            junk[j].alive=false; stats.merges++;
            spawnExplosion(junk[j].x, junk[j].y, '#888', 5);
          }
        }
      }
      junk[i].updateShapeAndSize(); junk[i].applyBehaviors(effDt);
    }
    junk = junk.filter(j=>j.alive);

    particles.forEach(p=>p.update(dt)); particles = particles.filter(p=>p.life>0);
    popups.forEach(p=>p.update(dt)); popups = popups.filter(p=>p.life>0);

    // Feature 34: Warning flash
    let nearBottom = junk.some(j=> (mode==='gravityflip'? j.y<80 : j.y>H()-80));
    els.warn.style.background = nearBottom ? 'rgba(255,0,0,0.25)' : 'transparent';
    if(nearBottom && !shieldActive && mode!=='safemode' && mode!=='hardcore') { /* lives handled in out of bounds */ }

    // Spawn powerups randomly
    if(Math.random()<0.0005*globalSpeed) {
      let types=['clear','slow','freeze','magnet','shield'];
      powerUpsSpawned.push(new PowerUp(Math.random()*W(), 100, types[Math.floor(Math.random()*types.length)]));
    }

    // HUD
    els.score.textContent = `Score: ${Math.floor(score)}`;
    els.combo.textContent = `Combo: x${multiplier.toFixed(1)}`;
    els.lives.textContent = mode==='safemode'?'🛡️ Safe':'❤️'.repeat(Math.max(0,lives));
    els.timer.textContent = mode==='timeattack'? `Time: ${Math.max(0,Math.ceil(30-gameTime))}` : mode==='minichallenge'? `Challenge: ${Math.ceil(challengeTimer)}s` : `Time: ${gameTime.toFixed(1)}`;
    els.spawnBar.style.width = `${Math.min(100, (1-spawnInterval/1200)*100)}%`;
  }

  // Draw
  ctx.fillStyle='#111'; ctx.fillRect(0,0,W(),H());
  // Grid bg
  ctx.strokeStyle='#222'; ctx.lineWidth=1;
  for(let i=0;i<W();i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H());ctx.stroke();}
  for(let i=0;i<H();i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W(),i);ctx.stroke();}

  // Draw entities
  powerUpsSpawned.forEach(p=>p.draw(ctx));
  junk.forEach(j=>j.draw(ctx));
  particles.forEach(p=>p.draw(ctx));
  popups.forEach(p=>p.draw(ctx));

  // UI Bars
  if(gameState===STATE.PLAYING || gameState===STATE.PAUSED) {
    let barY = H()-30;
    ctx.fillStyle='#333'; ctx.fillRect(W()/2-150, barY, 300, 12);
    let mulW = Math.min(300, (multiplier-1)*30);
    ctx.fillStyle='#0f0'; ctx.fillRect(W()/2-150, barY, mulW, 12);
    ctx.fillStyle='#fff'; ctx.fillText('MULTIPLIER', W()/2, barY+10);
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
