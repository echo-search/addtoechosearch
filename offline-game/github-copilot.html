<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cache Cleaner Simulator</title>
<style>
  :root{
    --bg:#0b1020;
    --panel:#0f1724cc;
    --accent:#6ee7b7;
    --danger:#ff6b6b;
    --muted:#94a3b8;
    --glass: rgba(255,255,255,0.03);
  }
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
  canvas{display:block;background:linear-gradient(180deg,#071028 0%, #081022 60%);width:100vw;height:100vh}
  #ui{
    position:fixed;left:12px;top:12px;z-index:30;color:#e6eef8;
    display:flex;gap:10px;flex-direction:column;align-items:flex-start;
    pointer-events:none;
  }
  .panel{
    pointer-events:auto;
    background:var(--panel);
    padding:10px;border-radius:8px;backdrop-filter:blur(6px);
    box-shadow:0 6px 18px rgba(0,0,0,0.6);
    border:1px solid rgba(255,255,255,0.03)
  }
  .row{display:flex;gap:8px;align-items:center}
  button,select{background:var(--glass);color:#e6eef8;border:1px solid rgba(255,255,255,0.04);padding:6px 8px;border-radius:6px;cursor:pointer}
  button.small{padding:4px 6px;font-size:13px}
  #topbar{position:fixed;right:12px;top:12px;z-index:30;display:flex;gap:10px;flex-direction:column}
  #stats{font-size:14px}
  #spawnBarCont{width:220px;height:12px;background:rgba(255,255,255,0.04);border-radius:6px;overflow:hidden}
  #spawnBar{height:100%;background:linear-gradient(90deg,#60a5fa,#7c3aed);width:0%}
  #waveText{position:fixed;left:50%;transform:translateX(-50%);top:12%;font-weight:700;color:#fff;padding:8px 16px;border-radius:999px;z-index:40;opacity:0}
  #controls{display:flex;gap:6px;flex-wrap:wrap}
  #bottomUI{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:30;display:flex;gap:10px}
  #pauseBtn{width:60px}
  #modeSelect{min-width:160px}
  #summary{position:fixed;inset:0;margin:auto;width:90%;max-width:720px;height:80%;top:10%;background:linear-gradient(180deg,#071026,#071022);border-radius:12px;padding:18px;display:none;z-index:100;color:#e6eef8;overflow:auto;border:1px solid rgba(255,255,255,0.04)}
  #summary h2{margin:0 0 8px 0}
  #summary .close{position:absolute;right:18px;top:18px}
  .popupScore{position:fixed;pointer-events:none;font-weight:700;color:#d1fae5;text-shadow:0 2px 6px rgba(0,0,0,0.7);z-index:40}
  .smallmuted{color:var(--muted);font-size:12px}
  #topInfo{display:flex;flex-direction:column;gap:6px}
  #soundToggle{display:inline-flex;align-items:center;gap:6px}
  .flashOverlay{position:fixed;inset:0;pointer-events:none;background:rgba(255,255,255,0);z-index:90;transition:background 300ms linear}
  #warningFlash{position:fixed;inset:0;pointer-events:none;background:transparent;z-index:85}
  /* simple responsive */
  @media (max-width:600px){
    #ui{left:8px;top:8px}
    #topbar{right:8px;top:8px}
    #bottomUI{gap:6px}
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
  <div class="panel">
    <div class="row" id="topInfo">
      <div style="font-weight:700;font-size:16px">Cache Cleaner Simulator</div>
      <div class="smallmuted">Click junk to clean. Hold to melt. Double-tap for power hit.</div>
    </div>
    <div style="height:8px"></div>
    <div class="row">
      <div id="stats">Score: <b id="score">0</b> • Lives: <b id="lives">3</b> • Combo: <b id="combo">0</b></div>
    </div>
    <div style="height:8px"></div>
    <div class="row">
      <div id="spawnBarCont"><div id="spawnBar"></div></div>
    </div>
    <div style="height:8px"></div>
    <div class="row" id="controls">
      <button id="pauseBtn" class="small">Pause</button>
      <select id="modeSelect">
        <option>Normal</option>
        <option>Easy</option>
        <option>Hard</option>
        <option>Time Attack</option>
        <option>Survival</option>
        <option>Precision Mode</option>
        <option>Chaos Mode</option>
        <option>One-Life Hardcore Mode</option>
        <option>Mini-Challenge</option>
        <option>Boss Rush</option>
        <option>Mirror Mode</option>
        <option>Gravity Flip Mode</option>
        <option>Safe Mode</option>
      </select>
      <button id="resetBtn" class="small">Restart</button>
    </div>
  </div>

  <div class="panel" style="margin-top:6px">
    <div class="row">
      <button id="powerClear" title="Clear all junk">Clear</button>
      <button id="powerSlow" title="Slow motion">Slow</button>
      <button id="powerShield" title="Shield">Shield</button>
      <button id="powerFreeze" title="Freeze">Freeze</button>
      <button id="powerMagnet" title="Magnet">Magnet</button>
    </div>
    <div style="height:8px"></div>
    <div class="row smallmuted">
      <div id="multBarCont" style="width:180px;background:rgba(255,255,255,0.03);height:10px;border-radius:6px;overflow:hidden">
        <div id="multBar" style="height:100%;width:0%;background:linear-gradient(90deg,#f59e0b,#f97316)"></div>
      </div>
      <div id="multText" style="min-width:48px;text-align:right">x1</div>
    </div>
  </div>
</div>

<div id="topbar">
  <div class="panel row">
    <div id="modeLabel">Mode: <b id="modeName">Normal</b></div>
    <div style="width:14px"></div>
    <div id="soundToggle"><label><input type="checkbox" id="soundCheck" checked> Sound</label></div>
  </div>
  <div class="panel" style="margin-top:6px">
    <div class="row smallmuted">Highscore: <b id="highscore">0</b></div>
  </div>
</div>

<div id="bottomUI">
  <button id="summaryBtn" class="small">Summary</button>
  <button id="challengeBtn" class="small">Mini-Challenges</button>
</div>

<div id="waveText">WAVE INCOMING</div>
<div class="flashOverlay" id="flash"></div>
<div id="warningFlash"></div>

<div id="summary" class="panel" role="dialog" aria-modal="true">
  <button class="close" id="closeSummary">Close</button>
  <h2>Game Summary</h2>
  <div id="summaryContent"></div>
</div>

<script>
/* Cache Cleaner Simulator - Single File Game
   Implements 50 features as requested.
   Structure: classes for Junk and Particle, Game manager, main loop with requestAnimationFrame.
*/

/* ---------------------------
   Utility & Globals
   ---------------------------*/
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
let W = canvas.width = innerWidth;
let H = canvas.height = innerHeight;

window.addEventListener('resize', ()=>{ W = canvas.width = innerWidth; H = canvas.height = innerHeight; game.onResize(); });

function rand(min,max){ return Math.random()*(max-min)+min; }
function rInt(min,max){ return Math.floor(rand(min,max+1)); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

function now(){ return performance.now(); }

/* ---------------------------
   Audio (simple beeps) & Sound toggle (feature 39)
   ---------------------------*/
class AudioSys{
  constructor(){
    this.ctx = null;
    this.enabled = true;
  }
  ensure(){
    if(!this.ctx){
      try{
        this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      }catch(e){ this.ctx = null; this.enabled = false; }
    }
  }
  beep(freq=440,duration=0.08, type='sine', vol=0.12){
    if(!this.enabled) return;
    this.ensure();
    if(!this.ctx) return;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(this.ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
    o.stop(this.ctx.currentTime + duration + 0.02);
  }
}
const audio = new AudioSys();

/* ---------------------------
   Particle class (feature 17,40)
   ---------------------------*/
class Particle{
  constructor(x,y,dx,dy,color,size,life=900){
    this.x=x;this.y=y;this.dx=dx;this.dy=dy;this.color=color;this.size=size;this.life=life;this.birth=now();
  }
  update(dt){
    this.x += this.dx * dt;
    this.y += this.dy * dt;
    this.dy += 0.0005 * dt; // gravity
  }
  draw(ctx){
    const t = (now()-this.birth)/this.life;
    if(t>1) return;
    ctx.globalAlpha = 1 - t;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size*(1-t),0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  expired(){ return now() - this.birth > this.life; }
}

/* ---------------------------
   Junk class (many behaviors)
   ---------------------------*/
class Junk{
  constructor(opts){
    // position & motion
    this.x = opts.x || rand(20, W-20);
    this.y = opts.y || (opts.spawnTop ? -20 : -10);
    this.vx = opts.vx || rand(-0.02,0.02);
    this.vy = opts.vy || (opts.gravityDir < 0 ? rand(-0.02,-0.01) : rand(0.01,0.03));
    this.size = opts.size || rand(12,34);
    this.color = opts.color || Junk.randomColor();
    this.shape = opts.shape || Junk.randomShape();
    this.rot = rand(0,Math.PI*2);
    this.rotSpeed = opts.rotSpeed || rand(-0.01,0.01);
    this.hp = opts.hp || 1;
    this.maxHp = this.hp;
    this.id = Math.random().toString(36).slice(2);
    this.spawnedAt = now();
    // behavior flags
    this.isGolden = !!opts.isGolden;
    this.isRed = !!opts.isRed;
    this.splitOnClick = !!opts.splitOnClick;
    this.sideways = !!opts.sideways;
    this.teleporting = !!opts.teleporting;
    this.boss = !!opts.boss;
    this.rotating = !!opts.rotating;
    this.shrinking = !!opts.shrinking;
    this.speedUpEvery = opts.speedUpEvery || 0;
    this.bounce = !!opts.bounce;
    this.zigzag = !!opts.zigzag;
    this.invisible = !!opts.invisible;
    this.fade = !!opts.fade;
    this.mergeable = !!opts.mergeable;
    this.explodes = !!opts.explodes;
    this.wave = !!opts.wave;
    this.storm = !!opts.storm;
    this.pulseSize = !!opts.pulseSize;
    this.teleCooldown = 0;
    this.visibleAlpha = 1;
    this.fadeDir = 1;
    this.mergeCooldown = 0;
    this.gravityDir = opts.gravityDir || 1; // 1 downward, -1 upward (gravity flip)
    this.amplitude = rand(10,80);
    this.zigDir = Math.random()>0.5?1:-1;
    this.lastSpeedUp = now();
  }

  static randomColor(){
    const palette = ['#60a5fa','#f472b6','#34d399','#f59e0b','#a78bfa','#fb7185','#f97316'];
    return palette[rInt(0,palette.length-1)];
  }
  static randomShape(){
    const shapes = ['circle','square','triangle','blob'];
    return shapes[rInt(0,shapes.length-1)];
  }

  update(dt, game){
    // basic gravity & motion
    // wave pattern (feature 18)
    if(this.wave){
      this.x += Math.sin((now()/1000)+this.size)*0.04*dt;
      this.y += 0.02 * this.gravityDir * dt;
    } else {
      this.x += this.vx * dt;
      this.y += this.vy * dt * this.gravityDir;
    }

    // sideways random move (4)
    if(this.sideways){
      this.x += Math.sin((now()+this.x)/500)*0.03*dt;
    }

    // zig-zag (13)
    if(this.zigzag){
      this.x += Math.sin((now()+this.x)/200)*0.06*this.zigDir*dt;
    }

    // rotate (9)
    if(this.rotating) this.rot += this.rotSpeed * dt;

    // teleporting (5)
    if(this.teleporting){
      this.teleCooldown -= dt;
      if(this.teleCooldown <= 0){
        if(Math.random() < 0.01 * (game.mode === 'Chaos Mode' ? 3 : 1)){
          this.x = rand(20, W-20);
          this.y = rand(-50, H/2);
          this.teleCooldown = 1000 + rand(0,3000);
        } else this.teleCooldown = 1000;
      }
    }

    // temporary invisibility (14)
    if(this.invisible){
      // toggle invisibility occasionally
      if(Math.random()<0.002* (game.mode==='Chaos Mode' ? 4:1)){
        this.visibleAlpha = 0;
        setTimeout(()=>{ this.visibleAlpha = 1; }, rInt(600,2200));
      }
    }

    // fade in/out (15)
    if(this.fade){
      this.visibleAlpha += 0.002 * this.fadeDir * dt;
      if(this.visibleAlpha > 1){ this.visibleAlpha = 1; this.fadeDir = -1; }
      if(this.visibleAlpha < 0.2){ this.visibleAlpha = 0.2; this.fadeDir = 1; }
    }

    // shrink over time (10)
    if(this.shrinking){
      this.size = Math.max(6, this.size - 0.002 * dt);
    }

    // change size while falling (20)
    if(this.pulseSize){
      this.size += Math.sin((now()+this.x)/3000)*0.02*dt;
      this.size = clamp(this.size,6,60);
    }

    // bounce off walls (12)
    if(this.bounce){
      if(this.x < this.size + 2){ this.x = this.size+2; this.vx *= -1; }
      if(this.x > W - this.size - 2){ this.x = W - this.size - 2; this.vx *= -1; }
    }

    // speed up every 10s (11)
    if(this.speedUpEvery>0 && now()-this.lastSpeedUp > this.speedUpEvery){
      this.vx *= 1.12; this.vy *= 1.12; this.lastSpeedUp = now();
    }

    // merge with others when touching (16)
    if(this.mergeable && this.mergeCooldown <= 0){
      for(let other of game.junks){
        if(other === this) continue;
        if(!other.mergeable) continue;
        if(now()-other.spawnedAt < 500 || now()-this.spawnedAt < 500) continue;
        const dx = other.x - this.x, dy = other.y - this.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < (this.size + other.size)*0.6){
          // merge into bigger
          this.size = Math.min(120,Math.sqrt(this.size*this.size+other.size*other.size));
          this.hp += other.hp;
          other.toRemove = true;
          this.mergeCooldown = 400;
          game.spawnParticles(this.x,this.y,8,this.color);
          break;
        }
      }
    } else {
      this.mergeCooldown -= dt;
    }

    // teleport occasionally when Chaos mode or teleporter
    // handled above

    // boundary bottom -> if reach bottom cause life loss unless safe mode or shield active
    const limit = this.gravityDir>0 ? H + 50 : -50;
    if( (this.gravityDir>0 && this.y - this.size > H) || (this.gravityDir<0 && this.y + this.size < 0) ){
      this.offBottom = true;
    } else this.offBottom = false;
  }

  draw(ctx, game){
    if(this.visibleAlpha <= 0.01) return;
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.rot);
    ctx.globalAlpha = this.visibleAlpha;
    const s = this.size;
    // color variations for golden/red
    let col = this.color;
    if(this.isGolden) col = '#FFD54A';
    if(this.isRed) col = '#ff4d4d';
    ctx.fillStyle = col;
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1;
    // shape draw
    if(this.shape === 'circle'){
      ctx.beginPath(); ctx.arc(0,0,s,0,Math.PI*2); ctx.fill(); ctx.stroke();
    } else if(this.shape === 'square'){
      ctx.beginPath(); ctx.rect(-s,-s,2*s,2*s); ctx.fill(); ctx.stroke();
    } else if(this.shape === 'triangle'){
      ctx.beginPath(); ctx.moveTo(0,-s); ctx.lineTo(s,s); ctx.lineTo(-s,s); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else { // blob
      ctx.beginPath();
      ctx.moveTo(-s,0);
      ctx.quadraticCurveTo( -s, -s, 0, -s*0.8 );
      ctx.quadraticCurveTo( s, -s*0.6, s, 0 );
      ctx.quadraticCurveTo( s, s*0.6, 0, s*0.8 );
      ctx.quadraticCurveTo( -s, s, -s, 0 );
      ctx.fill(); ctx.stroke();
    }

    // HP indicator for boss (6)
    if(this.boss){
      const barW = s*1.5;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(-barW/2, s+6, barW, 6);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(-barW/2, s+6, barW * (this.hp/this.maxHp), 6);
      ctx.strokeStyle = '#000'; ctx.strokeRect(-barW/2, s+6, barW,6);
    }

    ctx.globalAlpha = 1;
    ctx.restore();
  }

  containsPoint(x,y, game){
    // mirror mode reversed controls mapping handled by game before calling this
    const dx = x - this.x, dy = y - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    return dist <= this.size * 1.15;
  }

  takeDamage(amount, game, source='click'){
    // if boss requires multiple clicks
    this.hp -= amount;
    if(this.hp <= 0){
      this.onDestroy(game, source);
    } else {
      game.spawnParticles(this.x,this.y,6,this.color);
    }
  }

  onDestroy(game, source='click'){
    this.toRemove = true;
    // golden gives +5 points (7)
    let gain = 1;
    if(this.isGolden) gain = 5;
    if(this.isRed) gain = - (game.score>0 ? 5 : 0); // red removes score (8)
    // explosions into particles (17,40)
    if(this.explodes) game.spawnParticles(this.x,this.y, rInt(12,26), this.color);
    // spawn score popup
    game.onJunkDestroyed(this, gain, source);
    // split into smaller pieces when clicked (3)
    if(this.splitOnClick && source === 'click'){
      const count = rInt(2,4);
      for(let i=0;i<count;i++){
        game.junks.push(new Junk({
          x:this.x + rand(-10,10),
          y:this.y + rand(-10,10),
          vx:rand(-0.04,0.04),
          vy:rand(0.02,0.06),
          size:Math.max(6,this.size*0.45),
          color:this.color,
          shape: this.shape,
          mergeable:false
        }));
      }
    }
    // storm spawn if flagged (19) handled by game when appropriate
  }
}

/* ---------------------------
   Game class - manages everything
   ---------------------------*/
class Game{
  constructor(){
    this.junks = [];
    this.particles = [];
    this.spawnTimer = 0;
    this.spawnInterval = 1200; // ms
    this.lastUpdate = now();
    this.running = true;
    this.score = 0;
    this.lives = 3;
    this.combo = 0;
    this.comboTimer = 0;
    this.comboDecay = 2500; // ms
    this.multiplier = 1;
    this.multBarFill = 0;
    this.doubleTapWindow = 300;
    this.lastTapAt = 0;
    this.tapPos = {x:0,y:0};
    this.longPressThreshold = 400;
    this.longPressActive = false;
    this.longPressStart = 0;
    this.beamPos = null;
    this.shieldActive = false;
    this.freezeActive = false;
    this.magnetActive = false;
    this.slowMotionActive = false;
    this.shake = 0;
    this.waveIncoming = false;
    this.waveIncomingAt = 0;
    this.mode = 'Normal';
    this.gravityFlip = false;
    this.safeMode = false;
    this.oneLife = false;
    this.precisionMode = false;
    this.mirrorMode = false;
    this.timeAttackTimer = 0;
    this.survivalTime = 0;
    this.chaosMode = false;
    this.bossRush = false;
    this.miniChallenge = null;
    this.miniChallengeTimer = 0;
    this.stats = { clicks:0, destroyed:0, playTime:0, maxCombo:0, waves:0 };
    this.highscore = parseInt(localStorage.getItem('cc_highscore')||'0',10);
    document.getElementById('highscore').textContent = this.highscore;
    this.spawnSpeedProgress = 0;
    this.spawnAccumulator = 0;
    this.initEvents();
    this.onResize();
  }

  onResize(){
    // nothing special for now
  }

  initEvents(){
    // input handlers for clicks, double-tap, long-press, beam, magnet cursor
    canvas.addEventListener('pointerdown', (e)=>{
      if(!this.running) return;
      const p = this.getPointer(e);
      this.pointerDown(p.x,p.y,e);
    });
    canvas.addEventListener('pointerup', (e)=>{
      if(!this.running) return;
      const p = this.getPointer(e);
      this.pointerUp(p.x,p.y,e);
    });
    canvas.addEventListener('pointermove', (e)=>{
      const p = this.getPointer(e);
      this.pointerMove(p.x,p.y,e);
    });

    // UI controls
    document.getElementById('pauseBtn').addEventListener('click', ()=>{
      this.togglePause();
    });
    document.getElementById('resetBtn').addEventListener('click', ()=>{ this.reset(); });
    document.getElementById('powerClear').addEventListener('click', ()=>{ this.activatePowerClear(); });
    document.getElementById('powerSlow').addEventListener('click', ()=>{ this.activateSlowMotion(); });
    document.getElementById('powerShield').addEventListener('click', ()=>{ this.activateShield(); });
    document.getElementById('powerFreeze').addEventListener('click', ()=>{ this.activateFreeze(); });
    document.getElementById('powerMagnet').addEventListener('click', ()=>{ this.activateMagnet(); });
    document.getElementById('modeSelect').addEventListener('change', (e)=>{ this.setMode(e.target.value); });
    document.getElementById('summaryBtn').addEventListener('click', ()=>{ this.showSummary(); });
    document.getElementById('closeSummary').addEventListener('click', ()=>{ this.hideSummary(); });
    document.getElementById('challengeBtn').addEventListener('click', ()=>{ this.startMiniChallenge(); });
    document.getElementById('soundCheck').addEventListener('change', (e)=>{ audio.enabled = e.target.checked; });
    // keyboard shortcuts
    window.addEventListener('keydown', (e)=>{
      if(e.key === ' '){ this.togglePause(); e.preventDefault(); }
      if(e.key === '1') this.activatePowerClear();
      if(e.key === '2') this.activateSlowMotion();
    });
  }

  getPointer(e){
    // support mirror mode and gravity flip mapping
    let rect = canvas.getBoundingClientRect();
    let x = (e.clientX - rect.left) * (canvas.width / rect.width);
    let y = (e.clientY - rect.top) * (canvas.height / rect.height);
    if(this.mirrorMode) x = W - x;
    return { x, y };
  }

  pointerDown(x,y,e){
    this.pointerIsDown = true;
    this.pointerX = x; this.pointerY = y;
    this.longPressStart = now();
    this.longPressActive = false;
    // detect double-tap (27)
    const t = now();
    if(t - this.lastTapAt < this.doubleTapWindow && Math.hypot(this.tapPos.x - x,this.tapPos.y - y) < 40){
      // double-tap power hit
      this.doubleTap(x,y);
    } else {
      this.lastTapAt = t; this.tapPos = {x,y};
    }
    // immediate click detection (single click)
    this.handleClick(x,y);
  }

  pointerUp(x,y,e){
    this.pointerIsDown = false;
    if(this.longPressActive){
      this.longPressActive = false;
      this.beamPos = null;
      audio.beep(220,0.06,'sine');
    }
  }

  pointerMove(x,y,e){
    this.pointerX = x; this.pointerY = y;
  }

  handleClick(x,y){
    // clicking interacts with junk (player clicks)
    this.stats.clicks++;
    let hitAny = false;
    for(let i=this.junks.length-1;i>=0;i--){
      const j = this.junks[i];
      if(j.containsPoint(x,y,this)){
        hitAny = true;
        // if shield protects or other power-ups
        // apply damage
        let damage = 1 * this.multiplier;
        // double tap handled separately
        if(j.boss){
          damage = 1; // incremental damage
        }
        // precision mode: strict clicking -> penalize if click misses? we handle when not hitting
        j.takeDamage(damage, this, 'click');
        this.onHit(j);
        break;
      }
    }
    if(!hitAny){
      // miss penalty in Precision Mode (43)
      if(this.precisionMode){
        this.score = Math.max(0, this.score - 2);
        this.flashScreen('#ff4d4d',120);
      }
    }
  }

  doubleTap(x,y){
    // big hit to all junk in radius
    audio.beep(880,0.08,'square');
    let hitCount = 0;
    for(let j of this.junks.slice()){
      const d = Math.hypot(j.x - x, j.y - y);
      if(d < 120){
        j.takeDamage(3,this,'doubletap');
        hitCount++;
      }
    }
    if(hitCount>0) this.addCombo(hitCount);
  }

  onHit(junk){
    // combo & multiplier bar logic (21,22)
    this.combo++;
    this.comboTimer = now();
    this.multBarFill = Math.min(100, this.multBarFill + 6);
    this.multiplier = 1 + Math.floor(this.multBarFill / 25);
    document.getElementById('multBar').style.width = this.multBarFill + '%';
    document.getElementById('multText').textContent = 'x' + this.multiplier;
    // streak reward at 100 clicks (23)
    if(this.stats.clicks >= 100 && !this.streakRewardGiven){
      this.streakRewardGiven = true;
      this.multBarFill = 100; this.multiplier = 5;
      this.flashScreen('#60a5fa',300);
      this.spawnPopup(W/2, H/2, 'STREAK!', '#60a5fa');
      audio.beep(1200,0.14,'triangle');
    }
    // update stats
    this.stats.maxCombo = Math.max(this.stats.maxCombo, this.combo);
  }

  onJunkDestroyed(junk, baseGain, source='click'){
    // awarding points
    let points = baseGain * this.multiplier;
    if(junk.boss) points += Math.floor(junk.maxHp*2);
    if(junk.isRed) { this.score = Math.max(0, this.score + points); } // negative handled earlier
    else this.score += points;
    this.stats.destroyed++;
    // spawn floating +1/+5 (31)
    this.spawnPopup(junk.x + rand(-10,10), junk.y + rand(-10,10), (baseGain>1? '+'+baseGain : '+1'), junk.isGolden ? '#ffd54a' : '#bde9d8');
    // screen shake on life loss not here; but flash for power-ups (36)
    this.flashScreen('#fff', 80);
    audio.beep(600 + Math.random()*400, 0.06, 'sine');
    // storm spawns (19)
    if(junk.storm){
      this.spawnWave(20);
    }
  }

  spawnPopup(x,y,txt,color='#bde9d8'){
    const el = document.createElement('div');
    el.className = 'popupScore';
    el.style.left = (x) + 'px';
    el.style.top = (y) + 'px';
    el.style.color = color;
    el.style.transform = 'translate(-50%,-50%)';
    el.style.fontSize = '18px';
    el.textContent = txt;
    document.body.appendChild(el);
    const start = now();
    const dur = 800 + rand(0,400);
    const step = ()=>{
      const t = (now()-start)/dur;
      if(t>1){ el.remove(); return; }
      el.style.top = (y - t*60) + 'px';
      el.style.opacity = 1 - t;
      requestAnimationFrame(step);
    };
    step();
  }

  spawnParticles(x,y,count,color){
    for(let i=0;i<count;i++){
      const a = rand(0,Math.PI*2);
      const s = rand(1,6);
      const speed = rand(0.02,0.3);
      const dx = Math.cos(a)*speed;
      const dy = Math.sin(a)*speed;
      this.particles.push(new Particle(x,y,dx,dy,color,s,900+rand(0,600)));
    }
  }

  spawnJunk(opts={}){
    // create junk with various behaviors randomly
    const gravityDir = this.gravityFlip ? -1 : 1;
    const j = new Junk({
      x: opts.x,
      y: opts.y,
      vx: opts.vx,
      vy: opts.vy,
      size: opts.size || rand(10,40),
      color: opts.color,
      shape: opts.shape,
      rotSpeed: rand(-0.01,0.01),
      hp: opts.hp,
      spawnTop: opts.spawnTop !== undefined ? opts.spawnTop : true,
      gravityDir: gravityDir
    });

    // assign behaviors probabilistically considering mode
    const chaosFactor = (this.mode==='Chaos Mode' || this.chaosMode) ? 0.6 : 0.12;
    if(Math.random() < 0.06 + chaosFactor) j.splitOnClick = true; // 3
    if(Math.random() < 0.08 + chaosFactor) j.sideways = true; // 4
    if(Math.random() < 0.02 + chaosFactor) j.teleporting = true; //5
    if(Math.random() < 0.05 + (this.bossRush?0.7:0)) { j.boss = true; j.hp = rInt(3,8); j.maxHp = j.hp; }
    if(Math.random() < 0.03) j.isGolden = true;
    if(Math.random() < 0.03) j.isRed = true;
    if(Math.random() < 0.08 + chaosFactor) j.rotating = true;
    if(Math.random() < 0.06) j.shrinking = true;
    if(Math.random() < 0.05 + (this.survivalTime/60000)) j.speedUpEvery = 10000;
    if(Math.random() < 0.2) j.bounce = true;
    if(Math.random() < 0.08) j.zigzag = true;
    if(Math.random() < 0.06) j.invisible = true;
    if(Math.random() < 0.08) j.fade = true;
    if(Math.random() < 0.06) j.mergeable = true;
    if(Math.random() < 0.09) j.explodes = true;
    if(Math.random() < 0.06) j.wave = true;
    if(Math.random() < 0.04) j.storm = true;
    if(Math.random() < 0.08) j.pulseSize = true;
    // mania for chaos mode
    if(this.mode === 'Boss Rush'){
      j.boss = true; j.hp = rInt(4,12); j.maxHp = j.hp; j.size = rand(28,60);
    }
    // precision mode: slow junk but strict
    if(this.precisionMode){ j.vy *= 0.4; j.vx *= 0.4; }
    // gravity flip mode
    if(this.gravityFlip) { j.gravityDir = -1; j.y = H + 20; }
    this.junks.push(j);
  }

  spawnWave(count){
    this.waveIncoming = true;
    this.waveIncomingAt = now() + 600;
    setTimeout(()=>{
      this.waveIncoming = false;
      this.stats.waves++;
      for(let i=0;i<count;i++){
        this.spawnJunk({ spawnTop:true, size: rand(8,40) });
      }
    }, 600);
  }

  activatePowerClear(){
    // Power-up that clears all junk on screen (1)
    audio.beep(900,0.12,'sine');
    this.spawnParticles(W/2, H/2, 30, '#fff');
    for(let j of this.junks){ j.onDestroy(this,'powerClear'); }
    this.junks = [];
    this.flashScreen('#9ae6b4',200);
  }
  activateSlowMotion(){
    // Slow-motion power-up (2)
    if(this.slowMotionActive) return;
    this.slowMotionActive = true;
    this.slowUntil = now() + 3500;
    audio.beep(400,0.12,'sine');
    this.flashScreen('#bde0ff',180);
  }
  activateShield(){
    // Temporary shield (24)
    this.shieldActive = true; this.shieldUntil = now() + 6000;
    audio.beep(1200,0.12,'triangle');
    this.flashScreen('#a7f3d0',200);
  }
  activateFreeze(){
    // Freeze power-up (25)
    this.freezeActive = true; this.freezeUntil = now() + 5000;
    audio.beep(300,0.12,'sine');
    this.flashScreen('#b3c4ff',200);
  }
  activateMagnet(){
    // Magnet (26)
    this.magnetActive = true; this.magnetUntil = now() + 6000;
    audio.beep(700,0.12,'sine');
    this.flashScreen('#ffd6a5',200);
  }

  startMiniChallenge(){
    // Mini-challenges (46) Example: clean 20 in 10s
    if(this.miniChallenge) return;
    this.miniChallenge = { target:20, progress:0, duration:10000, start:now() };
    this.miniChallengeTimer = this.miniChallenge.duration;
    // spawn initial junk
    for(let i=0;i<12;i++) this.spawnJunk();
    audio.beep(1100,0.12,'sine');
  }

  setMode(mode){
    this.mode = mode;
    document.getElementById('modeName').textContent = mode;
    // set flags for modes (41-50)
    this.timeAttackTimer = 0; this.survivalTime = 0; this.chaosMode=false; this.bossRush=false; this.miniChallenge=null; this.precisionMode=false; this.oneLife=false; this.mirrorMode=false; this.gravityFlip=false; this.safeMode=false;
    if(mode === 'Time Attack'){ this.timeAttackTimer = 30000; }
    if(mode === 'Survival'){ /* difficulty increases over time */ }
    if(mode === 'Precision Mode'){ this.precisionMode = true; }
    if(mode === 'Chaos Mode'){ this.chaosMode = true; }
    if(mode === 'One-Life Hardcore Mode'){ this.oneLife = true; this.lives = 1; }
    if(mode === 'Mini-Challenge'){ this.startMiniChallenge(); }
    if(mode === 'Boss Rush'){ this.bossRush = true; }
    if(mode === 'Mirror Mode'){ this.mirrorMode = true; }
    if(mode === 'Gravity Flip Mode'){ this.gravityFlip = true; }
    if(mode === 'Safe Mode'){ this.safeMode = true; }
    // difficulty presets
    if(mode === 'Easy'){ this.spawnInterval = 1400; this.lives = 5; }
    else if(mode === 'Normal'){ this.spawnInterval = 1200; this.lives = 3; }
    else if(mode === 'Hard'){ this.spawnInterval = 900; this.lives = 2; }
    else if(mode === 'Time Attack'){ this.spawnInterval = 900; }
    else if(mode === 'Survival'){ this.spawnInterval = 1100; this.lives = 3; }
    document.getElementById('lives').textContent = this.lives;
  }

  togglePause(){ this.running = !this.running; document.getElementById('pauseBtn').textContent = this.running ? 'Pause' : 'Resume'; if(this.running){ this.lastUpdate = now(); this.loop(); } }
  reset(){
    this.junks = []; this.particles = []; this.score = 0; this.combo = 0; this.multBarFill = 0; this.multiplier = 1; this.spawnInterval = 1200; this.lives = 3; this.running = true;
    this.stats = { clicks:0, destroyed:0, playTime:0, maxCombo:0, waves:0 };
    document.getElementById('score').textContent = this.score;
    document.getElementById('lives').textContent = this.lives;
    document.getElementById('multBar').style.width = '0%';
    document.getElementById('multText').textContent = 'x1';
    audio.beep(800,0.08,'sine');
    this.lastUpdate = now();
  }

  showSummary(){
    this.running = false;
    document.getElementById('summary').style.display = 'block';
    const c = this.stats;
    const content = `
      <p>Score: <b>${this.score}</b></p>
      <p>Clicks: ${c.clicks}, Destroyed: ${c.destroyed}, Max Combo: ${c.maxCombo}</p>
      <p>Play Time: ${(c.playTime/1000).toFixed(1)}s</p>
      <p>Waves survived: ${c.waves}</p>
      <p>Highscore: <b>${this.highscore}</b></p>
      <button id="closeAndRestart">Close & Restart</button>
    `;
    document.getElementById('summaryContent').innerHTML = content;
    document.getElementById('closeAndRestart').addEventListener('click', ()=>{ this.hideSummary(); this.reset(); });
  }
  hideSummary(){ document.getElementById('summary').style.display = 'none'; this.running = true; this.lastUpdate = now(); this.loop(); }

  flashScreen(color, duration=140){
    const el = document.getElementById('flash');
    el.style.background = color;
    el.style.opacity = 0.14;
    setTimeout(()=>{ el.style.opacity = 0; el.style.background = 'transparent'; }, duration);
  }

  warningFlashOn(){
    const el = document.getElementById('warningFlash');
    el.style.background = 'rgba(255,90,90,0.06)';
    setTimeout(()=>{ el.style.background = 'transparent'; }, 220);
  }

  update(dt){
    if(this.slowMotionActive && now() > this.slowUntil) this.slowMotionActive = false;
    if(this.freezeActive && now() > this.freezeUntil) this.freezeActive = false;
    if(this.shieldActive && now() > this.shieldUntil) this.shieldActive = false;
    if(this.magnetActive && now() > this.magnetUntil) this.magnetActive = false;

    // spawn logic (33 spawn-speed progress bar)
    this.spawnAccumulator += dt;
    const effectiveSpawnInterval = this.slowMotionActive ? this.spawnInterval * 2 : this.spawnInterval;
    // survival mode increases spawn frequency over time
    let spInterval = effectiveSpawnInterval;
    if(this.mode === 'Survival') spInterval = Math.max(400, effectiveSpawnInterval - this.survivalTime*0.02);
    while(this.spawnAccumulator >= spInterval){
      this.spawnAccumulator -= spInterval;
      // storm spawns occasionally (19)
      if(Math.random() < 0.02 && this.mode !== 'Boss Rush') this.spawnWave(20);
      else {
        // Boss Rush spawns only bosses
        if(this.bossRush) this.spawnJunk({ size: rand(28,60) });
        else this.spawnJunk();
      }
    }
    // progress bar
    this.spawnSpeedProgress = clamp((this.spawnAccumulator / spInterval)*100,0,100);
    document.getElementById('spawnBar').style.width = this.spawnSpeedProgress + '%';

    // update junks
    const timeScale = this.slowMotionActive ? 0.5 : 1;
    for(let j of this.junks) j.update(dt * timeScale, this);

    // magnet mode pull (26)
    if(this.magnetActive && this.pointerX !== undefined){
      for(let j of this.junks){
        const dx = this.pointerX - j.x, dy = this.pointerY - j.y;
        const d = Math.hypot(dx,dy);
        if(d < 300){
          j.vx += (dx/d)*0.0015 * dt;
          j.vy += (dy/d)*0.0015 * dt;
        }
      }
    }

    // freeze active: stop motion
    if(this.freezeActive){
      for(let j of this.junks){
        j.vx *= 0.98;
        j.vy *= 0.98;
      }
    }

    // beam (long-press clean beam) (28)
    if(this.pointerIsDown && now() - this.longPressStart > this.longPressThreshold){
      if(!this.longPressActive){
        this.longPressActive = true;
        audio.beep(220,0.01,'sine');
      }
      // melt junk along beam
      const x = this.pointerX, y = this.pointerY;
      this.beamPos = { x, y };
      for(let j of this.junks.slice()){
        const d = Math.hypot(j.x - x, j.y - y);
        if(d < 80){
          j.takeDamage(0.035 * dt, this, 'beam'); // slow melt
        }
      }
    }

    // double-tap etc handled elsewhere

    // particles update
    for(let p of this.particles) p.update(dt);
    this.particles = this.particles.filter(p=>!p.expired());

    // remove destroyed junks
    const before = this.junks.length;
    this.junks = this.junks.filter(j=>{
      if(j.toRemove) return false;
      return true;
    });
    const after = this.junks.length;
    // life loss when junk reaches bottom (12, and 50 Safe Mode)
    for(let j of this.junks.slice()){
      if(j.offBottom){
        // remove and penalize life unless safe mode or shield
        j.toRemove = true;
        if(!this.safeMode && !this.shieldActive){
          this.lives -= 1;
          this.shake = 12;
          this.warningFlashOn();
          audio.beep(120,0.1,'sine');
          document.getElementById('lives').textContent = this.lives;
          // screen shake on life loss (32)
          if(this.lives <= 0){
            if(this.oneLife || this.mode==='One-Life Hardcore Mode'){ this.gameOver(); }
            else if(!this.safeMode){ this.gameOver(); }
          }
        } else {
          // shield consumed if active
          if(this.shieldActive){
            this.shieldActive = false;
          }
        }
      }
    }

    // combo decay
    if(this.combo > 0 && now() - this.comboTimer > this.comboDecay){
      this.combo = 0;
      this.multBarFill = Math.max(0, this.multBarFill - 10);
      this.multiplier = 1 + Math.floor(this.multBarFill / 25);
      document.getElementById('multBar').style.width = this.multBarFill + '%';
      document.getElementById('multText').textContent = 'x' + this.multiplier;
    }

    // update UI
    document.getElementById('score').textContent = this.score;
    document.getElementById('combo').textContent = this.combo;

    // warnings when junk near bottom (34)
    for(let j of this.junks){
      if(this.gravityFlip ? (j.y - j.size < 60) : (j.y + j.size > H - 80)){
        // flash subtle
        if(Math.random() < 0.04) this.warningFlashOn();
        break;
      }
    }

    // Wave incoming animation (35)
    if(this.waveIncoming){
      const el = document.getElementById('waveText');
      el.style.opacity = 1;
      el.style.transform = 'translateX(-50%) scale(1.02)';
      setTimeout(()=>{ el.style.opacity = 0; el.style.transform = 'translateX(-50%) scale(1)'; }, 500);
    }

    // update stats time
    this.stats.playTime += dt;
    this.survivalTime += dt;

    // mini-challenge update (46)
    if(this.miniChallenge){
      const elapsed = now() - this.miniChallenge.start;
      const remaining = Math.max(0, this.miniChallenge.duration - elapsed);
      this.miniChallengeTimer = remaining;
      // if destroyed increases progress tracked in onJunkDestroyed
      // auto-fail if time up
      if(remaining <= 0){
        if(this.miniChallenge.progress >= this.miniChallenge.target){
          this.spawnPopup(W/2,H/2,'CHALLENGE CLEAR','#34d399');
        } else {
          this.spawnPopup(W/2,H/2,'CHALLENGE FAILED','#ff6b6b');
        }
        this.miniChallenge = null;
      }
    }

    // update highscore locally
    if(this.score > this.highscore){ this.highscore = this.score; localStorage.setItem('cc_highscore', String(this.highscore)); document.getElementById('highscore').textContent = this.highscore; }

    // end time attack if timer ends (41)
    if(this.timeAttackTimer > 0){
      this.timeAttackTimer -= dt;
      if(this.timeAttackTimer <= 0){
        this.gameOver();
      }
    }
  }

  gameOver(){
    // end-of-game summary with stats (37)
    this.running = false;
    this.showSummary();
    audio.beep(180,0.4,'sine');
  }

  loop(){
    if(!this.running) return;
    const t = now();
    let dt = t - this.lastUpdate;
    this.lastUpdate = t;
    // cap dt
    dt = Math.min(40, dt);
    // screen shake effect
    if(this.shake > 0) this.shake *= 0.9;
    else this.shake = 0;
    // slowMotion modifies dt scales inside update
    this.update(dt);
    this.render();
    requestAnimationFrame(()=>this.loop());
  }

  render(){
    // clear
    ctx.save();
    ctx.fillStyle = '#071026';
    ctx.fillRect(0,0,W,H);
    // simple background gradient stripes
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#071028'); g.addColorStop(1,'#071022');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    // apply screen shake
    if(this.shake > 0){
      const sx = rand(-this.shake,this.shake);
      const sy = rand(-this.shake,this.shake);
      ctx.translate(sx,sy);
    }

    // draw particles
    for(let p of this.particles) p.draw(ctx);

    // draw junks
    for(let j of this.junks) j.draw(ctx,this);

    // draw beam if active
    if(this.longPressActive && this.beamPos){
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 22;
      ctx.beginPath();
      ctx.moveTo(this.beamPos.x - 200, this.beamPos.y);
      ctx.lineTo(this.beamPos.x + 200, this.beamPos.y);
      ctx.stroke();
      ctx.restore();
    }

    // draw HUD overlays: shield, freeze, magnet indicators
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    ctx.fillRect(8,H-50,220,36);
    ctx.fillStyle = '#e6eef8';
    ctx.font = '13px system-ui';
    let hx = 16;
    if(this.shieldActive){
      ctx.fillStyle = '#34d399'; ctx.fillText('Shield', hx, H-26); hx += 70;
    }
    if(this.freezeActive){
      ctx.fillStyle = '#60a5fa'; ctx.fillText('Freeze', hx, H-26); hx += 70;
    }
    if(this.magnetActive){
      ctx.fillStyle = '#f59e0b'; ctx.fillText('Magnet', hx, H-26); hx += 70;
    }
    ctx.restore();

    ctx.restore();
  }
}

   ---------------------------*/

  originalOnJunkDestroyed.call(this,junk,baseGain,source);
  if(this.miniChallenge){
    this.miniChallenge.progress++;
    // if goal reached early
    if(this.miniChallenge.progress >= this.miniChallenge.target){
      this.spawnPopup(W/2, H/2, 'MINI CHALLENGE COMPLETE',' #34d399');
      this.miniChallenge = null;
    }
  }
};

  if(this.score > this.highscore){ this.highscore = this.score; localStorage.setItem('cc_highscore', String(this.highscore)); document.getElementById('highscore').textContent = this.highscore; }
};

/* ---------------------------
   Clean interval & animation for elements such as mult bar decay
   ---------------------------*/
setInterval(()=>{
  // slowly decrease multiplier bar if not building combo
  if(game.multBarFill > 0 && (now() - game.comboTimer > 3000)){
    game.multBarFill = Math.max(0, game.multBarFill - 1);
    game.multiplier = 1 + Math.floor(game.multBarFill / 25);
    document.getElementById('multBar').style.width = game.multBarFill + '%';
    document.getElementById('multText').textContent = 'x' + game.multiplier;
  }
},150);

/* ---------------------------
   Final safety: ensure no errors if assets missing
   ---------------------------*/
console.log('Cache Cleaner Simulator initialized.');
</script>
