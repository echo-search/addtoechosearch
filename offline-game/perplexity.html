<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cache Cleaner Simulator</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#07111f;color:#e8f1ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;background:radial-gradient(circle at 50% 20%,#17304d 0,#09111d 55%,#05080d 100%)}
#ui{position:fixed;inset:0;pointer-events:none}
.panel{position:absolute;left:12px;top:12px;background:rgba(7,14,26,.72);border:1px solid rgba(130,180,255,.22);border-radius:12px;padding:10px 12px;backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.25);pointer-events:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,select,label{font:inherit}
button,select{background:#12304f;color:#e8f1ff;border:1px solid #315f93;border-radius:10px;padding:8px 10px;cursor:pointer}
button:hover,select:hover{filter:brightness(1.08)}
small{opacity:.85}
#hud{position:absolute;left:12px;top:88px;display:flex;gap:10px;flex-wrap:wrap;pointer-events:none}
.badge{background:rgba(9,18,34,.7);border:1px solid rgba(130,180,255,.22);border-radius:999px;padding:7px 10px;font-weight:600}
.bar{width:220px;height:12px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.bar>span{display:block;height:100%;width:0%;background:linear-gradient(90deg,#41d1ff,#7cff7c)}
#centerMsg{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:38px;font-weight:800;letter-spacing:.06em;text-shadow:0 4px 18px rgba(0,0,0,.35);opacity:0;transition:opacity .15s}
#flash{position:fixed;inset:0;background:rgba(255,255,255,.0);pointer-events:none;transition:background .12s}
#summary{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:320px;max-width:min(90vw,560px);background:rgba(5,10,18,.92);border:1px solid rgba(130,180,255,.28);border-radius:18px;padding:18px;display:none;pointer-events:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#summary h2{margin:0 0 10px}
#summary p{margin:6px 0}
#controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pop{position:absolute;will-change:transform,opacity;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.3);pointer-events:none}
.warning{color:#ffda7a}
.good{color:#8cff9e}
.bad{color:#ff7d7d}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="flash"></div>
<div id="ui">
  <div class="panel">
    <div class="row">
      <label>Mode <select id="mode"></select></label>
      <label>Difficulty <select id="difficulty"></select></label>
      <button id="pauseBtn">Pause</button>
      <button id="soundBtn">Sound: On</button>
      <button id="restartBtn">Restart</button>
    </div>
    <small>Click junk to clean. Some junk splits, shatters, merges, or fights back.</small>
  </div>
  <div id="hud">
    <div class="badge">Score: <span id="score">0</span></div>
    <div class="badge">High: <span id="highscore">0</span></div>
    <div class="badge">Lives: <span id="lives">3</span></div>
    <div class="badge">Time: <span id="time">0.0</span></div>
    <div class="badge">Combo x<span id="combo">1</span></div>
    <div class="badge" style="min-width:240px">Multiplier <div class="bar"><span id="multBar"></span></div></div>
    <div class="badge" style="min-width:240px">Spawn <div class="bar"><span id="spawnBar"></span></div></div>
  </div>
  <div id="centerMsg"></div>
  <div id="summary"></div>
</div>
<script>
(()=>{const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),ui={score:document.getElementById('score'),high:document.getElementById('highscore'),lives:document.getElementById('lives'),time:document.getElementById('time'),combo:document.getElementById('combo'),multBar:document.getElementById('multBar'),spawnBar:document.getElementById('spawnBar'),center:document.getElementById('centerMsg'),flash:document.getElementById('flash'),summary:document.getElementById('summary'),mode:document.getElementById('mode'),difficulty:document.getElementById('difficulty'),pauseBtn:document.getElementById('pauseBtn'),soundBtn:document.getElementById('soundBtn'),restartBtn:document.getElementById('restartBtn')};const modes=['Time Attack','Survival','Precision Mode','Chaos Mode','One-Life Hardcore Mode','Mini-Challenges','Boss Rush','Mirror Mode','Gravity Flip Mode','Safe Mode'],diffs=['Easy','Normal','Hard'];ui.mode.innerHTML=modes.map(m=>`<option>${m}</option>`).join('');ui.difficulty.innerHTML=diffs.map(d=>`<option>${d}</option>`).join('');let W,H,dpr,score=0,high=+localStorage.cacheCleanerHigh||0,lives=3,combo=0,comboTimer=0,mult=1,spawnProg=0,t=0,paused=false,soundOn=true,gameOver=false,shake=0,mode='Time Attack',difficulty='Normal',waveText=0,stats={hits:0,misses:0,cleaned:0,bosses:0},pointer={x:0,y:0,down:false,pressAt:0,long:false};const junk=[],particles=[];let shield=0,freeze=0,magnet=0,slowmo=0,beam=0,spawnTimer=0,storm=0,miniTimer=10,miniDone=0,gravityFlip=0;function resize(){dpr=devicePixelRatio||1;W=canvas.width=innerWidth*dpr;H=canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px'}addEventListener('resize',resize);resize();function rand(a,b){return a+Math.random()*(b-a)}function dist(x1,y1,x2,y2){return Math.hypot(x1-x2,y1-y2)}function randColor(){return['#7cf','#fc7','#9f7','#f79','#fff','#8cf'][Math.floor(Math.random()*6)]}function pickKind(){const ks=['normal','splitter','side','teleport','boss','gold','red','rot','shrinker','speedy','bounce','zig','invisible','fade','merge','wave','morph','clear','slow','shield','freeze','magnet','clean'];return ks[Math.floor(Math.random()*ks.length)]}function powerFlash(){ui.flash.style.background='rgba(255,255,255,.45)';setTimeout(()=>ui.flash.style.background='rgba(255,255,255,0)',80)}function addPopup(text,x,y,cls){const e=document.createElement('div');e.className='pop '+cls;e.textContent=text;e.style.left=(x/dpr)+'px';e.style.top=(y/dpr)+'px';document.body.appendChild(e);let life=0;const id=setInterval(()=>{life+=.016;e.style.transform=`translate(-50%,-${life*40}px) scale(${1+life*.4})`;e.style.opacity=String(1-life);if(life>=.8){clearInterval(id);e.remove()}},16)}function explode(x,y,c,n){for(let i=0;i<n;i++)particles.push(new Particle(x,y,rand(-220,220),rand(-220,220),c,rand(20,40)))}function clearJunk(){for(const j of junk)j.dead=true;explode(W/2,H/2,'#9be7ff',50)}function addScore(v,x,y){const m=Math.max(1,mult);score+=Math.round(v*m);if(score<0)score=0;if(score>high){high=score;localStorage.cacheCleanerHigh=high}combo++;comboTimer=2.5;mult=Math.min(5,1+combo/20);spawnProg=Math.min(1,spawnProg+0.06);addPopup((v>0?'+':'')+Math.round(v*m),x,y,v>0?'good':'bad');if(combo===100){shield=4;powerFlash();addPopup('STREAK',W*.5,H*.2,'good')}}class Particle{constructor(x,y,vx,vy,c,l=30){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.c=c;this.life=l;this.max=l;this.size=rand(1.5,3.5)}update(dt){this.life-=dt*60;this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy+=280*dt*(gravityFlip?-1:1)}draw(){ctx.globalAlpha=Math.max(0,this.life/this.max);ctx.fillStyle=this.c;ctx.fillRect(this.x,this.y,this.size,this.size)}}class Junk{constructor(x,y,vx,vy,r,kind){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.r=r;this.baseR=r;this.kind=kind||pickKind();this.hp=this.kind==='boss'?3+Math.floor(Math.random()*3):1;this.angle=Math.random()*Math.PI*2;this.spin=(Math.random()-.5)*4;this.phase=Math.random()*10;this.alpha=1;this.visible=true;this.teleportAt=rand(1.5,4);this.invisAt=rand(1.5,4);this.splitAt=.5+Math.random()*1.3;this.bounce=Math.random()<.4;this.sideways=Math.random()<.45;this.zig=Math.random()<.35;this.wave=Math.random()<.5;this.color=randColor();this.shape=Math.floor(Math.random()*4)}update(dt){if(freeze>0)return;let sp=1+(t/10)*.08;if(difficulty==='Hard')sp*=1.2;if(difficulty==='Easy')sp*=.85;if(mode==='Precision Mode')sp*=.7;if(mode==='Chaos Mode')sp*=1+Math.sin(t*2+this.phase)*.15;this.y+=this.vy*dt*sp*(gravityFlip?-1:1);this.x+=this.vx*dt*sp;if(this.sideways)this.vx+=Math.sin(t*3+this.phase)*.5*dt;if(this.zig)this.x+=Math.sin(t*12+this.phase)*30*dt;if(this.wave)this.x+=Math.sin((this.y/70)+t*2+this.phase)*40*dt;if(this.bounce){if(this.x<this.r){this.x=this.r;this.vx*=-1}if(this.x>W-this.r){this.x=W-this.r;this.vx*=-1}}if(this.x<-120||this.x>W+120||this.y<-180||this.y>H+180)this.dead=true;this.angle+=this.spin*dt;this.r=Math.max(6,this.baseR*(this.kind==='shrinker'?1-(t%5)/6:1)*(this.kind==='morph'?0.7+0.5*Math.sin(t*3+this.phase):1));if(this.kind==='invisible'&&t>this.invisAt){this.visible=!this.visible;this.invisAt=t+rand(1.5,3)}if(this.kind==='fade')this.alpha=.35+.65*Math.abs(Math.sin(t*2+this.phase));if(this.kind==='teleport'&&t>this.teleportAt){this.x=rand(this.r,W-this.r);this.y=rand(50,H*.7);this.teleportAt=t+rand(2,4)}if(this.kind==='boss'&&this.hp<=1)this.color='#ffd86b';if(this.kind==='gold')this.color='#ffd84a';if(this.kind==='red')this.color='#ff5a5a';if(this.kind==='merge')this.tryMerge()}draw(){if(!this.visible)return;ctx.save();ctx.globalAlpha=this.alpha*(freeze>0?.7:1);ctx.translate(this.x,this.y);ctx.rotate(this.angle);ctx.fillStyle=this.color;ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=2*dpr;ctx.beginPath();const s=this.r;if(this.shape===0)ctx.arc(0,0,s,0,Math.PI*2);else if(this.shape===1){for(let i=0;i<5;i++){const a=i*1.256,rr=i%2?s:s*.45,px=Math.cos(a)*rr,py=Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}else if(this.shape===2){ctx.rect(-s,-s,s*2,s*2)}else{ctx.moveTo(0,-s);ctx.lineTo(s*.9,s*.6);ctx.lineTo(-s*.9,s*.6);ctx.closePath()}ctx.fill();ctx.stroke();if(this.kind==='boss'&&this.hp>1){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-s,s+5,s*2,5);ctx.fillStyle='#ffcc66';ctx.fillRect(-s,s+5,s*2*(this.hp/5),5)}ctx.restore()}hit(){this.hp--;if(this.hp<=0){this.dead=true;explode(this.x,this.y,this.color,18);addScore(this.kind==='gold'?5:(this.kind==='red'?-3:1),this.x,this.y);stats.cleaned++;if(this.kind==='boss')stats.bosses++;if(this.kind==='splitter')split(this);if(this.kind==='clear')clearJunk();if(this.kind==='slow')slowmo=4;if(this.kind==='shield')shield=6;if(this.kind==='freeze')freeze=3;if(this.kind==='magnet')magnet=5;if(this.kind==='clean')beam=4;if(this.kind==='teleport')powerFlash()}else{shake=10;addPopup('-1',this.x,this.y,'bad')}}tryMerge(){for(const o of junk){if(o!==this&&!o.dead&&dist(this.x,this.y,o.x,o.y)<this.r+o.r&&Math.random()<.01){this.r=Math.min(70,this.r+o.r*.2);o.dead=true}}}}function split(j){for(let i=0;i<3;i++)junk.push(new Junk(j.x,j.y,rand(-120,120),rand(-240,-60),Math.max(10,j.r*.55),'normal'))}function spawn(n=1,boss=false){for(let i=0;i<n;i++){const x=rand(40,W-40),y=gravityFlip?rand(H*.1,H*.3):rand(-120,-30),vy=boss?rand(35,60):rand(60,140),vx=rand(-30,30),r=rand(14,34),k=boss?'boss':pickKind();junk.push(new Junk(x,y,vx,vy,r,k))}}function controls(){return mode==='Mirror Mode'?{x:W-pointer.x,y:pointer.y}:{x:pointer.x,y:pointer.y}}function loseLife(){lives--;shake=18;addPopup('-LIFE',pointer.x*dpr,pointer.y*dpr,'bad');if(lives<=0&&!isSafe())endGame()}function isSafe(){return mode==='Safe Mode'}function onClick(x,y){if(paused||gameOver)return;const p=controls();const hit=[...junk].reverse().find(j=>!j.dead&&dist(p.x*dpr,p.y*dpr,j.x,j.y)<j.r*dpr*1.15);if(hit){hit.hit();stats.hits++;if(mode==='Mini-Challenges')miniDone++}else{stats.misses++;combo=0;mult=1;if(!shield)loseLife()}}function endGame(){gameOver=true;paused=true;ui.summary.style.display='block';ui.summary.innerHTML=`<h2>Game Over</h2><p>Score: ${score}</p><p>High Score: ${high}</p><p>Hits: ${stats.hits} | Misses: ${stats.misses}</p><p>Cleaned: ${stats.cleaned} | Bosses: ${stats.bosses}</p><div id="controls"><button id="again">Play Again</button><button id="close">Close</button></div>`;document.getElementById('again').onclick=restart;document.getElementById('close').onclick=()=>ui.summary.style.display='none'}function restart(){score=0;lives=mode==='One-Life Hardcore Mode'?1:3;combo=0;comboTimer=0;mult=1;spawnProg=0;t=0;paused=false;gameOver=false;shield=0;freeze=0;magnet=0;slowmo=0;beam=0;spawnTimer=0;storm=0;miniDone=0;miniTimer=10;gravityFlip=mode==='Gravity Flip Mode';junk.length=0;particles.length=0;stats={hits:0,misses:0,cleaned:0,bosses:0};ui.summary.style.display='none';spawn(8)}function update(dt){if(paused||gameOver)return;t+=dt;if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0){combo=0;mult=1}}if(shield>0)shield-=dt;if(freeze>0)freeze-=dt;if(magnet>0)magnet-=dt;if(slowmo>0)slowmo-=dt;if(beam>0)beam-=dt;if(mode==='Time Attack'&&t>=30)endGame();if(mode==='Mini-Challenges'){miniTimer-=dt;if(miniDone>=20||miniTimer<=0)endGame()}if(mode==='Chaos Mode'&&Math.random()<dt*.8)spawn(1);spawnTimer-=dt*(difficulty==='Easy'?1.2:difficulty==='Normal'?1:0.75);if(spawnTimer<=0){const count=storm>0?20:(mode==='Boss Rush'?1:(mode==='Mini-Challenges'?2:1+Math.floor(t/15)));spawn(count,mode==='Boss Rush');spawnTimer=Math.max(.25,2.2-(t*.03));spawnProg=0;if(Math.random()<.15){storm=2;ui.center.textContent='WAVE INCOMING';ui.center.style.opacity=1;waveText=1.2}}if(storm>0)storm-=dt;if(waveText>0){waveText-=dt;if(waveText<=0)ui.center.style.opacity=0}for(const j of junk){if(magnet>0){const c=controls(),dx=c.x-j.x*dpr,dy=c.y-j.y*dpr,d=Math.hypot(dx,dy)+1;j.vx+=dx/d*220*dt;j.vy+=dy/d*220*dt}if(beam>0&&Math.abs(j.x*dpr-pointer.x*dpr)<28*dpr)j.hit();j.update(dt*(slowmo>0?.35:1))}for(let i=junk.length-1;i>=0;i--)if(junk[i].dead)junk.splice(i,1);for(const p of particles)p.update(dt);for(let i=particles.length-1;i>=0;i--)if(particles[i].life<=0)particles.splice(i,1);if(shake>0)shake-=dt*50;ui.score.textContent=score;ui.high.textContent=high;ui.lives.textContent=lives;ui.time.textContent=(mode==='Time Attack'?Math.max(0,30-t):t).toFixed(1);ui.combo.textContent=Math.max(1,combo||1);ui.multBar.style.width=((mult-1)/4*100)+'%';ui.spawnBar.style.width=((1-(spawnTimer/2.2))*100)+'%'}function draw(){ctx.save();if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));ctx.clearRect(0,0,W,H);if(mode==='Gravity Flip Mode'){ctx.translate(0,H);ctx.scale(1,-1)}for(const j of junk)j.draw();for(const p of particles)p.draw();if(beam>0){ctx.strokeStyle='rgba(120,255,200,.7)';ctx.lineWidth=4*dpr;ctx.beginPath();ctx.moveTo(pointer.x*dpr,0);ctx.lineTo(pointer.x*dpr,H);ctx.stroke()}if(freeze>0){ctx.fillStyle='rgba(170,220,255,.08)';ctx.fillRect(0,0,W,H)}if(magnet>0){ctx.strokeStyle='rgba(255,255,120,.3)';ctx.beginPath();ctx.arc(pointer.x*dpr,pointer.y*dpr,50*dpr,0,Math.PI*2);ctx.stroke()}ctx.restore()}function loop(ts){if(!loop.last)loop.last=ts;const dt=Math.min(.033,(ts-loop.last)/1000);loop.last=ts;update(dt);draw();requestAnimationFrame(loop)}canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top});canvas.addEventListener('mousedown',()=>{pointer.down=true;pointer.pressAt=performance.now();onClick(pointer.x,pointer.y)});addEventListener('mouseup',()=>pointer.down=false);canvas.addEventListener('touchstart',e=>{const t0=e.touches,r=canvas.getBoundingClientRect();pointer.x=t0.clientX-r.left;pointer.y=t0.clientY-r.top;pointer.down=true;pointer.pressAt=performance.now();onClick(pointer.x,pointer.y)},{passive:true});canvas.addEventListener('touchmove',e=>{const t0=e.touches,r=canvas.getBoundingClientRect();pointer.x=t0.clientX-r.left;pointer.y=t0.clientY-r.top},{passive:true});addEventListener('touchend',()=>pointer.down=false,{passive:true});addEventListener('keydown',e=>{if(e.key===' '){paused=!paused;ui.pauseBtn.textContent=paused?'Resume':'Pause'}if(e.key==='Escape')ui.summary.style.display='none'});ui.pauseBtn.onclick=()=>{paused=!paused;ui.pauseBtn.textContent=paused?'Resume':'Pause'};ui.soundBtn.onclick=()=>{soundOn=!soundOn;ui.soundBtn.textContent='Sound: '+(soundOn?'On':'Off')};ui.restartBtn.onclick=restart;ui.mode.onchange=()=>{mode=ui.mode.value;restart()};ui.difficulty.onchange=()=>{difficulty=ui.difficulty.value;restart()};canvas.addEventListener('contextmenu',e=>e.preventDefault());restart();requestAnimationFrame(loop)})(); 
</script>
</body>
</html>
