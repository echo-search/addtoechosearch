<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wordle Unlimited</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family: Arial, sans-serif;
background:#121213;
color:white;
text-align:center;
}

h1{
margin-top:20px;
}

#board{
display:grid;
grid-template-columns:repeat(5,60px);
gap:6px;
justify-content:center;
margin-top:30px;
}

.tile{
width:60px;
height:60px;
border:2px solid #3a3a3c;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:bold;
text-transform:uppercase;
transition:transform .3s;
}

.flip{
transform:rotateX(90deg);
}

.correct{ background:#538d4e; border:none; }
.present{ background:#b59f3b; border:none; }
.absent{ background:#3a3a3c; border:none; }

#keyboard{
margin-top:30px;
max-width:500px;
margin-left:auto;
margin-right:auto;
}

.key{
display:inline-block;
margin:3px;
padding:10px 12px;
background:#818384;
border-radius:4px;
cursor:pointer;
user-select:none;
font-size:14px;
}

.key.correct{ background:#538d4e; }
.key.present{ background:#b59f3b; }
.key.absent{ background:#3a3a3c; }

#message{
margin-top:20px;
font-size:18px;
}

button{
margin-top:15px;
padding:8px 14px;
font-size:14px;
}

</style>
</head>

<body>

<h1>Wordle Unlimited</h1>

<label>
<input type="checkbox" id="hardMode">
Hard Mode
</label>

<div id="board"></div>

<div id="keyboard"></div>

<div id="message"></div>

<button onclick="newGame()">New Game</button>

<script>

const WORDS=[
"apple","grape","chair","table","brick","smile","bread","plant","stone","water",
"light","cloud","train","sweet","mouse","crane","sugar","brown","green","watch",
"sound","earth","metal","north","south","pilot","dream","flame","spice","storm"
];

const MAX_GUESSES=6;
const WORD_LENGTH=5;

let WORD;
let currentRow;
let currentGuess;
let gameOver=false;

let stats=JSON.parse(localStorage.getItem("wordleStats"))||{
played:0,
wins:0,
streak:0,
maxStreak:0
};

const board=document.getElementById("board");
const keyboard=document.getElementById("keyboard");
const message=document.getElementById("message");

function pickWord(){
return WORDS[Math.floor(Math.random()*WORDS.length)].toUpperCase();
}

function newGame(){

board.innerHTML="";
keyboard.innerHTML="";
message.textContent="";

WORD=pickWord();
currentRow=0;
currentGuess="";
gameOver=false;

createBoard();
createKeyboard();

}

function createBoard(){

for(let i=0;i<MAX_GUESSES*WORD_LENGTH;i++){
const tile=document.createElement("div");
tile.className="tile";
board.appendChild(tile);
}

}

function createKeyboard(){

const rows=["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];

rows.forEach(row=>{

const div=document.createElement("div");

for(let l of row){

const key=document.createElement("span");
key.className="key";
key.textContent=l;
key.onclick=()=>press(l);
div.appendChild(key);

}

keyboard.appendChild(div);

});

const enter=document.createElement("span");
enter.className="key";
enter.textContent="ENTER";
enter.onclick=submitGuess;
keyboard.appendChild(enter);

const del=document.createElement("span");
del.className="key";
del.textContent="DEL";
del.onclick=deleteLetter;
keyboard.appendChild(del);

}

function press(letter){

if(gameOver) return;

if(currentGuess.length<WORD_LENGTH){
currentGuess+=letter;
updateBoard();
}

}

function deleteLetter(){

currentGuess=currentGuess.slice(0,-1);
updateBoard();

}

function updateBoard(){

const tiles=document.querySelectorAll(".tile");

for(let i=0;i<WORD_LENGTH;i++){

const tile=tiles[currentRow*WORD_LENGTH+i];
tile.textContent=currentGuess[i]||"";

}

}

function colorKey(letter,state){

document.querySelectorAll(".key").forEach(k=>{

if(k.textContent===letter){

if(state==="correct") k.className="key correct";
else if(state==="present" && !k.classList.contains("correct"))
k.className="key present";
else if(state==="absent" && !k.classList.contains("correct") && !k.classList.contains("present"))
k.className="key absent";

}

});

}

function submitGuess(){

if(gameOver) return;
if(currentGuess.length!==WORD_LENGTH) return;

if(document.getElementById("hardMode").checked){

for(let i=0;i<WORD_LENGTH;i++){

const tiles=document.querySelectorAll(".tile");
const prev=tiles[(currentRow-1)*WORD_LENGTH+i];

if(prev && prev.classList.contains("correct") && currentGuess[i]!==prev.textContent){

message.textContent="Hard mode: must reuse green letters";
return;

}

}

}

const tiles=document.querySelectorAll(".tile");

for(let i=0;i<WORD_LENGTH;i++){

const tile=tiles[currentRow*WORD_LENGTH+i];
const letter=currentGuess[i];

setTimeout(()=>{

tile.classList.add("flip");

setTimeout(()=>{

if(letter===WORD[i]){
tile.classList.add("correct");
colorKey(letter,"correct");
}

else if(WORD.includes(letter)){
tile.classList.add("present");
colorKey(letter,"present");
}

else{
tile.classList.add("absent");
colorKey(letter,"absent");
}

tile.classList.remove("flip");

},150);

},i*300);

}

if(currentGuess===WORD){

gameOver=true;

stats.played++;
stats.wins++;
stats.streak++;
stats.maxStreak=Math.max(stats.streak,stats.maxStreak);

localStorage.setItem("wordleStats",JSON.stringify(stats));

setTimeout(()=>{

message.textContent="You win!";

shareGrid();

},1600);

return;

}

currentRow++;
currentGuess="";

if(currentRow===MAX_GUESSES){

gameOver=true;

stats.played++;
stats.streak=0;

localStorage.setItem("wordleStats",JSON.stringify(stats));

setTimeout(()=>{

message.textContent="Game Over! Word was "+WORD;

shareGrid();

},1600);

}

}

function shareGrid(){

let grid="";

const tiles=document.querySelectorAll(".tile");

for(let r=0;r<=currentRow;r++){

for(let c=0;c<WORD_LENGTH;c++){

const t=tiles[r*WORD_LENGTH+c];

if(t.classList.contains("correct")) grid+="🟩";
else if(t.classList.contains("present")) grid+="🟨";
else grid+="⬛";

}

grid+="\n";

}

navigator.clipboard.writeText(grid);

}

document.addEventListener("keydown",e=>{

const key=e.key.toUpperCase();

if(key==="ENTER") submitGuess();
else if(key==="BACKSPACE") deleteLetter();
else if(/^[A-Z]$/.test(key)) press(key);

});

newGame();

</script>

</body>
</html>
