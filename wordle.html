<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wordle Unlimited</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family: Arial, sans-serif;
background:#121213;
color:white;
text-align:center;
}

h1{
margin-top:20px;
}

#board{
display:grid;
grid-template-columns:repeat(5,60px);
gap:6px;
justify-content:center;
margin-top:30px;
}

#toast{
position:fixed;
top:20%;
left:50%;
transform:translateX(-50%);
background:#3a3a3c;
color:white;
padding:12px 18px;
border-radius:6px;
font-weight:bold;
opacity:0;
pointer-events:none;
transition:opacity .3s;
}

#toast.show{
opacity:1;
}

.tile{
width:60px;
height:60px;
border:2px solid #3a3a3c;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:bold;
text-transform:uppercase;
transition:transform .3s;
}

.flip{
transform:rotateX(90deg);
}

.correct{ background:#538d4e; border:none; }
.present{ background:#b59f3b; border:none; }
.absent{ background:#3a3a3c; border:none; }

#keyboard{
margin-top:30px;
max-width:500px;
margin-left:auto;
margin-right:auto;
}

.key{
display:inline-block;
margin:3px;
padding:10px 12px;
background:#818384;
border-radius:4px;
cursor:pointer;
user-select:none;
font-size:14px;
}

.key.correct{ background:#538d4e; }
.key.present{ background:#b59f3b; }
.key.absent{ background:#3a3a3c; }

button{
margin-top:15px;
padding:8px 14px;
font-size:14px;
}

</style>
</head>

<body>

<h1>Wordle Unlimited</h1>

<label>
<input type="checkbox" id="hardMode">
Hard Mode
</label>

<div id="board"></div>

<div id="keyboard"></div>

<div id="toast"></div>

<button onclick="newGame()">New Game</button>

<script>

const WORDS=["about","above","abuse","actor","acute","admit","adopt","adult","after","again","agent","agree","ahead","alarm","album","alert","alike","alive","allow","alone","along","alter","among","anger","angle","angry","apart","apple","apply","argue","arise","array","aside","asset","audio","audit","avoid","award","aware","badly","baker","bases","basic","basis","beach","began","begin","begun","being","below","bench","billy","birth","black","blame","blind","block","blood","board","boost","booth","bound","brain","brand","bread","break","breed","brief","bring","broad","broke","brown","build","built","buyer","cable","carry","catch","cause","chain","chair","chart","chase","cheap","check","cheek","cheer","chest","chief","child","china","choir","chose","civil","claim","class","clean","clear","click","clock","close","coach","coast","could","count","court","cover","craft","crash","cream","crime","cross","crowd","crown","curve","cycle","daily","dance","dated","dealt","death","debut","delay","depth","doing","doubt","dozen","draft","drama","drawn","dream","dress","drill","drink","drive","drove","dying","eager","early","earth","eight","elite","empty","enemy","enjoy","enter","entry","equal","error","event","every","exact","exist","extra","faith","false","fault","favor","fewer","field","fifth","fifty","fight","final","first","fixed","flash","fleet","floor","focus","force","forth","forty","forum","found","frame","frank","fraud","fresh","front","fruit","fully","funny","giant","given","glass","globe","going","grace","grade","grand","grant","grass","great","green","gross","group","grown","guard","guess","guest","guide","happy","harry","heart","heavy","hence","henry","horse","hotel","house","human","ideal","image","imply","index","inner","input","issue","japan","jimmy","joint","jones","judge","known","label","large","laser","later","laugh","layer","learn","least","leave","legal","level","light","limit","links","lives","local","logic","loose","lower","lucky","lunch","lying","magic","major","maker","march","maria","match","maybe","mayor","meant","media","metal","might","minor","minus","mixed","model","money","month","moral","motor","mount","mouse","mouth","movie","music","needs","never","newly","night","noise","north","noted","novel","nurse","occur","ocean","offer","often","order","other","ought","paint","panel","paper","party","peace","peter","phase","phone","photo","piece","pilot","pitch","place","plain","plane","plant","plate","point","pound","power","press","price","pride","prime","print","prior","prize","proof","proud","prove","queen","quick","quiet","quite","radio","raise","range","rapid","ratio","reach","react","ready","refer","right","rival","river","robin","rough","round","route","royal","rural","scale","scene","scope","score","serve","seven","shall","shape","share","sharp","sheet","shelf","shell","shift","shine","shirt","shock","shoot","short","shown","sight","since","sixth","sixty","skill","slave","sleep","slide","small","smart","smile","smith","smoke","snake","snowy","solid","solve","sorry","sound","south","space","spare","speak","speed","spend","spent","split","spoke","sport","staff","stage","stake","stand","start","state","steam","steel","stick","still","stock","stone","stood","store","storm","story","strip","stuck","study","stuff","style","sugar","suite","super","sweet","table","taken","taste","tasty","teach","teeth","thank","theft","their","theme","there","these","thick","thing","think","third","those","three","threw","throw","tight","title","today","topic","total","touch","tough","tower","track","trade","trail","train","trend","trial","tribe","trick","tried","tries","truck","truly","trust","truth","twice","under","undue","union","unite","unity","until","upper","upset","urban","usage","usual","value","video","virus","visit","vital","voice","waste","watch","water","waves","wears","weigh","where","which","while","white","whole","whose","woman","women","world","worry","worse","worth","would","wound","write","wrong","wrote","young","youth","zebra","zesty"];

const MAX_GUESSES=6;
const WORD_LENGTH=5;

let WORD;
let currentRow;
let currentGuess;
let gameOver=false;

let stats=JSON.parse(localStorage.getItem("wordleStats"))||{
played:0,
wins:0,
streak:0,
maxStreak:0
};

const board=document.getElementById("board");
const keyboard=document.getElementById("keyboard");
const toast=document.getElementById("toast");

function pickWord(){
return WORDS[Math.floor(Math.random()*WORDS.length)].toUpperCase();
}

function newGame(){

board.innerHTML="";
keyboard.innerHTML="";
showToast("");

WORD=pickWord();
currentRow=0;
currentGuess="";
gameOver=false;

createBoard();
createKeyboard();

}

function createBoard(){

for(let i=0;i<MAX_GUESSES*WORD_LENGTH;i++){
const tile=document.createElement("div");
tile.className="tile";
board.appendChild(tile);
}

}

function createKeyboard(){

const rows=["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];

rows.forEach(row=>{

const div=document.createElement("div");

for(let l of row){

const key=document.createElement("span");
key.className="key";
key.textContent=l;
key.onclick=()=>press(l);
div.appendChild(key);

}

keyboard.appendChild(div);

});

const enter=document.createElement("span");
enter.className="key";
enter.textContent="ENTER";
enter.onclick=submitGuess;
keyboard.appendChild(enter);

const del=document.createElement("span");
del.className="key";
del.textContent="DEL";
del.onclick=deleteLetter;
keyboard.appendChild(del);

}

function press(letter){

if(gameOver) return;

if(currentGuess.length<WORD_LENGTH){
currentGuess+=letter;
updateBoard();
}

}

function deleteLetter(){

currentGuess=currentGuess.slice(0,-1);
updateBoard();

}

function updateBoard(){

const tiles=document.querySelectorAll(".tile");

for(let i=0;i<WORD_LENGTH;i++){

const tile=tiles[currentRow*WORD_LENGTH+i];
tile.textContent=currentGuess[i]||"";

}

}

function colorKey(letter,state){

document.querySelectorAll(".key").forEach(k=>{

if(k.textContent===letter){

if(state==="correct") k.className="key correct";
else if(state==="present" && !k.classList.contains("correct"))
k.className="key present";
else if(state==="absent" && !k.classList.contains("correct") && !k.classList.contains("present"))
k.className="key absent";

}

});

}

async function submitGuess(){

if(gameOver) return;
if(currentGuess.length!==WORD_LENGTH) return;

const valid = await isRealWord(currentGuess);

if(!valid){
showToast("Not a real word");
return;
}

if(document.getElementById("hardMode").checked){

for(let i=0;i<WORD_LENGTH;i++){

const tiles=document.querySelectorAll(".tile");
const prev=tiles[(currentRow-1)*WORD_LENGTH+i];

if(prev && prev.classList.contains("correct") && currentGuess[i]!==prev.textContent){

showToast("Hard mode: must reuse green letters");
return;

}

}

}

const tiles=document.querySelectorAll(".tile");

for(let i=0;i<WORD_LENGTH;i++){

const tile=tiles[currentRow*WORD_LENGTH+i];
const letter=currentGuess[i];

setTimeout(()=>{

tile.classList.add("flip");

setTimeout(()=>{

if(letter===WORD[i]){
tile.classList.add("correct");
colorKey(letter,"correct");
}

else if(WORD.includes(letter)){
tile.classList.add("present");
colorKey(letter,"present");
}

else{
tile.classList.add("absent");
colorKey(letter,"absent");
}

tile.classList.remove("flip");

},150);

},i*300);

}

if(currentGuess===WORD){

gameOver=true;

stats.played++;
stats.wins++;
stats.streak++;
stats.maxStreak=Math.max(stats.streak,stats.maxStreak);

localStorage.setItem("wordleStats",JSON.stringify(stats));

setTimeout(()=>{

showToast("Splendid");

shareGrid();

},1600);

return;

}

currentRow++;
currentGuess="";

if(currentRow===MAX_GUESSES){

gameOver=true;

stats.played++;
stats.streak=0;

localStorage.setItem("wordleStats",JSON.stringify(stats));

setTimeout(()=>{

showToast("Game Over! Word was "+WORD);

shareGrid();

},1600);

}

}

function shareGrid(){

let grid="";

const tiles=document.querySelectorAll(".tile");

for(let r=0;r<=currentRow;r++){

for(let c=0;c<WORD_LENGTH;c++){

const t=tiles[r*WORD_LENGTH+c];

if(t.classList.contains("correct")) grid+="🟩";
else if(t.classList.contains("present")) grid+="🟨";
else grid+="⬛";

}

grid+="\n";

}

navigator.clipboard.writeText(grid);

}

document.addEventListener("keydown",e=>{

const key=e.key.toUpperCase();

if(key==="ENTER") submitGuess();
else if(key==="BACKSPACE") deleteLetter();
else if(/^[A-Z]$/.test(key)) press(key);

});

newGame();

async function isRealWord(word){

const res = await fetch("https://api.datamuse.com/words?sp=" + word.toLowerCase() + "&max=1");
const data = await res.json();

return data.length > 0 && data[0].word === word.toLowerCase();

}

function showToast(text){

const toast=document.getElementById("toast");

toast.textContent=text;
toast.classList.add("show");

setTimeout(()=>{
toast.classList.remove("show");
},2000);

}
</script>

</body>
</html>
