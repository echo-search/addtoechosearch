<body class="default home-page">
  <header class="home-header" role="banner" aria-label="EchoSearch header">
    <!-- Centered logo (base64 placeholder required) -->
    <div class="home-logo-wrap" style="text-align:center;">
      <img id="homeLogo" alt="EchoSearch" src="data:image/png;base64,{{BASE64_LOGO_HERE}}" class="logo-image" />
    </div>

    <!-- Theme selector preserved exactly (kept so existing theme logic attaches) -->
    <div class="theme-selector" style="margin-top:1rem; text-align:center;">
      <label for="theme" class="visually-hidden">Theme</label>
      <select id="theme" aria-label="Select theme">
        <option value="default">Default</option>
        <option value="dark">Dark</option>
        <option value="retro">Retro</option>
        <option value="neon">Neon</option>
        <option value="ocean">Ocean</option>
        <option value="midnight">Midnight</option>
        <option value="sunset">Sunset</option>
        <option value="matrix">Matrix</option>
        <option value="cyberpunk">Cyberpunk</option>
        <option value="forest">Forest</option>
        <option value="floral">Floral</option>
      </select>
    </div>
  </header>

  <!-- Centered main search form that submits to results page -->
  <main class="home-main" role="main" aria-label="Search">
    <form id="homeSearchForm" class="home-search-form" action="essentials/results.html" method="get" autocomplete="on" role="search">
      <div class="search-container centered">
        <input type="search" role="search" id="searchInput" name="q" placeholder="Type your search..." autocomplete="on" />
        <ul id="suggestions" aria-hidden="true"></ul>
        <button type="button" class="voice-btn" id="voiceBtn" aria-label="Voice search" title="Voice search">🎤</button>
      </div>
      <div class="button-group centered" style="margin-top:1rem;">
        <button type="submit" id="searchBtn" aria-label="Search">Search</button>
        <button type="button" id="surpriseBtn" aria-label="I'm Feeling Lucky">Surprise</button>
      </div>
    </form>
  </main>

  <!-- Optional UI bits preserved so JS finds them (audio/emoji/frame/chat toggles etc) -->
  <a href="essentials/login.html" id="accountLink" class="account-link" aria-label="Account"><span class="icon">👤</span><span class="label">Account</span></a>

  <audio id="audio67" src="essentials/67.m4a"></audio>
  <div id="emojiContainer" aria-hidden="true"></div>

  <div id="articles-link" aria-hidden="true"></div>

  <h2 id="historyTitle" style="display:none; margin-top:1rem;"></h2>
  <ul id="historyList" aria-hidden="true"></ul>
  <button id="clearBtn" style="display:none; margin-bottom:0.5rem;">Clear</button>

  <div id="newTabToggle" aria-hidden="true">
    <span class="toggle-text">Open in new tab</span>
    <div id="openInNewTabSlider" class="slider-switch"></div>
  </div>

  <div id="featureResult" class="feature-result hidden" aria-hidden="true"></div>

  <iframe id="aiFrame" style="display:none;"></iframe>

  <div id="echosearch-serp" style="display:none;">
    <div role="main" id="gcse-results">
      <div class="gcse-searchresults-only" data-gname="searchbox1" enableAutoComplete="true"></div>
    </div>
  </div>

  <a href="articles/version-history.html" class="version-badge">v.3.0 beta</a>

  <button id="chatBtn" class="chat-btn" style="display:none;" aria-hidden="true">Chat</button>

  <div class="pri-pol">By using EchoSearch, you agree to the <a href="articles/privacy-policy.html">Privacy Policy</a> and <a href="articles/terms-of-conditions.html">Terms of Conditions</a>.</div>

  <noscript>

      JavaScript is required to use EchoSearch.<br>
      Please turn it on and refresh the page.
    </div>
  </noscript>
