<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EchoSearch – CSE Live Answer</title>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  max-width: 900px;
  margin: auto;
  padding: 20px;
  background: #fafafa;
  color: #111;
}
#answer { margin-bottom: 20px; }
.answer-card {
  border-left: 4px solid #4caf50;
  background: #f6fff6;
  padding: 14px;
  margin-bottom: 20px;
}
.answer-card h3 { font-size:12px; color:#2e7d32; text-transform:uppercase; margin:0 0 6px; }
.answer-card p { font-size:16px; margin:0 0 8px; }
.answer-card a { font-size:14px; color:#1a73e8; text-decoration:none; }
.gcse-search { margin-top:10px; }
</style>

<!-- Google CSE -->
<script async src="https://cse.google.com/cse.js?cx=8504b5117a0734987"></script>
</head>
<body>

<h1>EchoSearch – CSE Live Answer</h1>

<div id="answer"></div>
<div class="gcse-search"></div>

<script>
/* ============================
   Python-like JS logic
============================ */
function normalize(text) {
  return text.toLowerCase().replace(/[^\w\s]/g, "").trim();
}

function validSentence(s, query) {
  const words = s.split(/\s+/);
  if (words.length < 6 || words.length > 30) return false;
  const badStarts = ["this","it","they","these","those","he","she"];
  if (badStarts.some(b => s.toLowerCase().startsWith(b))) return false;
  const hedges = ["may","might","often","generally","usually"];
  if (hedges.some(h => s.toLowerCase().includes(h))) return false;
  return normalize(s).includes(normalize(query));
}

function buildAnchor(url, text) {
  return url + "#:~:text=" + encodeURIComponent(text);
}

function findAnswerFromCSE(query) {
  const container = document.querySelector("div.gsc-resultsbox-visible");
  if (!container) return null;
  const items = Array.from(container.querySelectorAll(".gsc-webResult.gsc-result"));

  // Extract snippets
  const pages = items.map(item => {
    const urlEl = item.querySelector(".gs-title a");
    const snippetEl = item.querySelector(".gs-bidi-start-align");
    return {
      url: urlEl ? urlEl.href : "",
      snippet: snippetEl ? snippetEl.innerText : ""
    };
  });

  const candidates = [];
  for (const page of pages) {
    const sentences = page.snippet.split(/(?<=[.!?])\s+/);
    for (const s of sentences) {
      if (validSentence(s, query)) candidates.push({text: s.trim(), url: page.url});
    }
  }

  const seen = new Set();
  const unique = [];
  for (const c of candidates) {
    const key = normalize(c.text);
    if (!seen.has(key)) {
      seen.add(key);
      unique.push(c);
    }
  }

  // Multi-source confirmation
  for (const c of unique) {
    const count = unique.filter(o => normalize(o.text) === normalize(c.text)).length;
    if (count >= 2) return c;
  }
  return null;
}

/* ============================
   Hook into search box
============================ */
window.__gcse = {
  callback: function() {
    const input = document.querySelector("input.gsc-input");
    if (!input) return;

    input.addEventListener("keydown", e => {
      if (e.key !== "Enter") return;
      setTimeout(() => { // wait for CSE results to load
        const query = input.value;
        const container = document.getElementById("answer");
        container.innerHTML = "";

        const answer = findAnswerFromCSE(query);
        if (answer) {
          container.innerHTML = `
            <div class="answer-card">
              <h3>Answer</h3>
              <p>${answer.text}</p>
              <a href="${buildAnchor(answer.url, answer.text)}" target="_blank" rel="noopener">Source</a>
            </div>
          `;
        }
      }, 500); // small delay for results to appear
    });
  }
};
</script>
</body>
</html>
